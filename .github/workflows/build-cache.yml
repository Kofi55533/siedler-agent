name: build-cache
on:
  workflow_dispatch:
    inputs:
      ref: { description: 'siedler-sim-rs ref to build', default: 'codex/clean-commands' }
permissions:
  contents: read
jobs:
  build:
    if: github.actor == 'Kofi55533'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh "${{ inputs.ref }}" 0
      - name: Build (quiet)
        run: |
          echo "nproc=$(nproc)"; free -h | sed -n 2p
          scripts/s5-build.sh || { echo "build failed; last error lines suppressed (private)"; grep -c '^error' /opt/s5/build.log; exit 1; }
          source scripts/s5-env.sh; du -sh $S5_REPO/recomp/target | cut -f1
      - name: Smoke live wintersturm
        run: scripts/s5-live.sh wintersturm || true
      - name: Upload cache to private release
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/build-cache-upload.sh
