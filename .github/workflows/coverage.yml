name: coverage
# Native coverage map of siedler-sim-rs origin/clean/integration for the planner (prompts/planner.md section 1),
# published as COVERAGE.md + coverage-meta.txt on release `coverage-cache` of this repo.
# The reference traces depend only on recomp/ + the data-v2 game data/fixtures + sampling, not on s5clean, so they are
# cached per fixture as release assets trace-<fixture>--<key>.json.gz (scripts/coverage_keys.sh); hourly runs only
# rebuild the map from the cached aggregates + the current crates/s5clean/src cited check, and trace a fixture only
# when its key changed. Full fixture horizons (COVER_MAX_TURNS=1000000), sampled every 25 turns + command turns.
# bc-full (~hours) runs as its own job so it never blocks the others.
# Separate workflow file on purpose: refill.yml only counts opencode.yml runs.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  COVER_STEP: '25'
  COVER_MAX_TURNS: '1000000'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: coverage-plan, cancel-in-progress: false }
    outputs:
      main: ${{ steps.p.outputs.main }}
      bc: ${{ steps.p.outputs.bc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Keys, cache check, rebuild COVERAGE.md from cache
        id: p
        env:
          T: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          t0=$(date +%s)
          SIM=$RUNNER_TEMP/sim
          git clone -q --depth 1 -b clean/integration "https://x-access-token:${T}@github.com/Kofi55533/siedler-sim-rs.git" $SIM
          echo "clean/integration=$(git -C $SIM rev-parse --short HEAD)"
          scripts/coverage_keys.sh $SIM > keys.txt
          gh release view coverage-cache -R Kofi55533/siedler-agent --json assets -q '.assets[].name' > assets.txt 2>/dev/null || : > assets.txt
          main=""; bc=false
          while read -r f k; do
            grep -qx "trace-$f--$k.json.gz" assets.txt && continue
            if [ "$f" = bc-full ]; then bc=true; else main="$main $f"; fi
          done < keys.txt
          echo "to trace: main=[${main# }] bc-full=$bc"
          echo "main=${main# }" >> "$GITHUB_OUTPUT"; echo "bc=$bc" >> "$GITHUB_OUTPUT"
          scripts/coverage_publish.sh $SIM 1
          echo "plan secs=$(( $(date +%s)-t0 ))"
  trace:
    needs: plan
    if: needs.plan.outputs.main != ''
    runs-on: ubuntu-latest
    timeout-minutes: 200
    concurrency: { group: coverage-main, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup game data, toolchain, build cache (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh codex/clean-commands 1
      - name: Checkout clean/integration + build s5recomp (quiet)
        run: |
          source scripts/s5-env.sh
          cd $S5_REPO
          git fetch -q --depth 1 origin clean/integration
          git checkout -q --detach FETCH_HEAD
          echo "clean/integration=$(git rev-parse --short HEAD)"
          cd recomp && t0=$(date +%s)
          cargo build --release -j "$(nproc)" -p s5recomp > $S5/build-recomp.log 2>&1; rc=$?
          echo "s5recomp build exit=$rc secs=$(( $(date +%s)-t0 ))"
          [ $rc = 0 ] || { echo "error lines: $(grep -c '^error' $S5/build-recomp.log) (log suppressed, private)"; exit 1; }
      - name: Trace changed fixtures (parallel) + upload
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          source scripts/s5-env.sh
          cd $S5_REPO
          $GITHUB_WORKSPACE/scripts/coverage_run.sh "${{ needs.plan.outputs.main }}" 150m
      - name: Rebuild + publish COVERAGE.md
        if: always()
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/coverage_publish.sh /opt/s5/siedler-sim-rs 1
  bc-full:
    needs: plan
    if: needs.plan.outputs.bc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency: { group: coverage-bc, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup game data, toolchain, build cache (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh codex/clean-commands 1
      - name: Checkout clean/integration + build s5recomp (quiet)
        run: |
          source scripts/s5-env.sh
          cd $S5_REPO
          git fetch -q --depth 1 origin clean/integration
          git checkout -q --detach FETCH_HEAD
          echo "clean/integration=$(git rev-parse --short HEAD)"
          cd recomp && t0=$(date +%s)
          cargo build --release -j "$(nproc)" -p s5recomp > $S5/build-recomp.log 2>&1; rc=$?
          echo "s5recomp build exit=$rc secs=$(( $(date +%s)-t0 ))"
          [ $rc = 0 ] || { echo "error lines: $(grep -c '^error' $S5/build-recomp.log) (log suppressed, private)"; exit 1; }
      - name: Trace bc-full (full horizon) + upload
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          source scripts/s5-env.sh
          cd $S5_REPO
          $GITHUB_WORKSPACE/scripts/coverage_run.sh bc-full 325m
      - name: Rebuild + publish COVERAGE.md
        if: always()
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/coverage_publish.sh /opt/s5/siedler-sim-rs 1
