name: coverage
# Hourly native coverage map of origin/clean/integration (tools/coverage_map.sh, SKIP_BC_FULL=1), published as
# assets COVERAGE.md + coverage-meta.txt on the release `coverage-cache` of this repo. Planner runs only download it
# (prompts/planner.md section 1) instead of block-tracing the reference themselves. Separate workflow file on purpose:
# refill.yml only counts opencode.yml runs, so this job never occupies a DeepSeek slot.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coverage-cache
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup game data, toolchain, build cache (quiet)
        env:
          T: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: scripts/s5-setup.sh codex/clean-commands 1
      - name: Checkout clean/integration + build s5recomp (quiet)
        run: |
          source scripts/s5-env.sh
          cd $S5_REPO
          git fetch -q --depth 1 origin clean/integration
          git checkout -q --detach FETCH_HEAD
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "clean/integration=$(git rev-parse --short HEAD)"
          cd recomp && t0=$(date +%s)
          cargo build --release -j "$(nproc)" -p s5recomp > $S5/build-recomp.log 2>&1; rc=$?
          echo "s5recomp build exit=$rc secs=$(( $(date +%s)-t0 ))"
          [ $rc = 0 ] || { echo "error lines: $(grep -c '^error' $S5/build-recomp.log) (log suppressed, private)"; exit 1; }
      - name: Coverage map (quiet)
        run: |
          source scripts/s5-env.sh
          cd $S5_REPO
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          t0=$(date +%s)
          set +e
          SKIP_BC_FULL=1 OUT=$RUNNER_TEMP/COVERAGE.md timeout 50m bash tools/coverage_map.sh > $RUNNER_TEMP/cov.log 2>&1; rc=$?
          set -e
          # only fixture names, turn ranges and timings (no game data)
          grep -E '^coverage_map: ' $RUNNER_TEMP/cov.log | sed "s#$RUNNER_TEMP#.#" || true
          echo "coverage_map exit=$rc secs=$(( $(date +%s)-t0 ))"
          if [ $rc != 0 ] || [ ! -s $RUNNER_TEMP/COVERAGE.md ]; then
            echo "last lines (error context only):"; grep -vE '^coverage_map: ' $RUNNER_TEMP/cov.log | tail -n 5 | cut -c1-200; exit 1
          fi
          wc -c < $RUNNER_TEMP/COVERAGE.md | awk '{print "COVERAGE.md bytes", $1}'
      - name: Publish to release coverage-cache
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          R: ${{ github.repository }}
        run: |
          cd $RUNNER_TEMP
          { echo "clean_integration_sha=$SHA"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "started_utc=$START_UTC"
            echo "workflow_run=$GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID"
            echo "cmd=SKIP_BC_FULL=1 tools/coverage_map.sh (default fixtures)"; } > coverage-meta.txt
          if ! gh release view coverage-cache -R "$R" >/dev/null 2>&1; then
            gh release create coverage-cache -R "$R" --target main --prerelease -t coverage-cache \
              -n "Hourly coverage map of siedler-sim-rs clean/integration (coverage.yml). Assets are overwritten each run." >/dev/null
          fi
          gh release upload coverage-cache -R "$R" --clobber COVERAGE.md coverage-meta.txt
          gh release view coverage-cache -R "$R" --json assets -q '.assets[]|"\(.name) \(.size)"'
