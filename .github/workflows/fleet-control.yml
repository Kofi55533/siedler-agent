name: fleet-control-v2
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [shadow, control]
        default: shadow
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [fleet-worker-v2, fleet-verify-v2, fleet-integrate-v2, opencode, gate-baseline]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: fleet-control-v2
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rearm: ${{ steps.control.outputs.rearm }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only shadow or approved controller
        id: control
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          FLEET_V2_ENABLED: ${{ vars.FLEET_V2_ENABLED }}
          FLEET_V2_WORKER_LIMIT: ${{ vars.FLEET_V2_WORKER_LIMIT || '16' }}
          MODE: ${{ inputs.mode || 'control' }}
        run: |
          # 2026-10-23: the package/gate pipeline is retired (one function per task, verified against the oracle
          # by the worker itself, replaces it). The controller stays read-only until the new loop takes over.
          MODE=shadow
          python3 scripts/autonomy.py "$MODE"
      - name: Keep the scoreboard fresh
        # scoreboard.yml's own */15 cron fires only every few hours on this busy repo (2026-10-23: one run in 3 h) and
        # the box timer that used to dispatch it is gone; this controller runs every few minutes, so it starts a build
        # when the newest scoreboard run is 14 min or older. One REST call per cycle; never fails the control job.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          R: ${{ github.repository }}
        run: |
          last=$(gh api "repos/$R/actions/workflows/scoreboard.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""' || true)
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 840 ]; then
            gh api -X POST "repos/$R/actions/workflows/scoreboard.yml/dispatches" -f ref=main || true
          fi
  rearm:
    # Idle/backoff and controller failures must recover even when cron does
    # not fire. Productive workers normally wake the controller themselves.
    # This timer uses a runner only while no producer can provide that wakeup,
    # or after a failed control cycle; it never retries a refused model call.
    needs: control
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.FLEET_V2_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'control') &&
      (needs.control.outputs.rearm == 'true' || needs.control.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Recheck after idle backoff without depending on cron
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          sleep 270
          gh workflow run fleet-control.yml -R "$R" --ref main -f mode=control
