name: fleet-control
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Keep state, start, or pause new task claims'
        default: keep
        type: choice
        options: [keep, 'true', 'false']
      limit:
        description: 'Rollout ceiling 1..40; empty keeps current ceiling'
        required: false
        type: string
  workflow_run:
    workflows: [fleet-worker, fleet-plan, fleet-integrate, opencode]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: fleet-controller
  cancel-in-progress: false
jobs:
  control:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.actor == 'Kofi55533' || github.actor == 'Dominickofi00') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure and refill private fleet
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          FLEET_ENABLED: ${{ inputs.enabled }}
          FLEET_LIMIT: ${{ inputs.limit }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          args = ['python3', 'scripts/fleet.py', 'configure']
          if os.environ.get('FLEET_ENABLED') in ('true', 'false'):
              args += ['--enabled', os.environ['FLEET_ENABLED']]
          if os.environ.get('FLEET_LIMIT'):
              args += ['--limit', str(int(os.environ['FLEET_LIMIT']))]
          if len(args) > 3:
              subprocess.run(args, check=True)
          subprocess.run(['python3', 'scripts/fleet.py', 'control'], check=True)
          PY
