name: fleet-integrate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-integrate-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor == 'Kofi55533' || github.actor == 'Dominickofi00'
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      CI: 'true'
      NO_COLOR: '1'
      S5_SCRIPTS: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run private fleet operation
        run: python3 scripts/fleet.py integrate
