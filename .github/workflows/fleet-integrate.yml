name: fleet-integrate-v2
run-name: combined integration ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      nonce: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: fleet-integration-v2
  cancel-in-progress: false
jobs:
  integrate:
    if: vars.FLEET_V2_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Private verification inputs
        env: {T: '${{ secrets.PRIVATE_REPO_TOKEN }}'}
        run: scripts/s5-setup.sh clean/integration 1
      - name: Test and atomically integrate the combined tree
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          FLEET_V2_ENABLED: ${{ vars.FLEET_V2_ENABLED }}
          NONCE: ${{ inputs.nonce }}
        run: |
          source scripts/s5-env.sh
          python3 scripts/autonomy.py integrate --nonce "$NONCE"
