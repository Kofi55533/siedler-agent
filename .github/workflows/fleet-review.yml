name: fleet-review
on:
  pull_request:
    paths: ['scripts/**', 'prompts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline scheduling, evidence and atomic integration tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts/autonomy.py scripts/autonomy_state.py scripts/gate_contract.py
          bash -n scripts/s5-gate.sh
