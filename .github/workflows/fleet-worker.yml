name: fleet-worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-worker-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  worker:
    if: github.actor == 'Kofi55533' || github.actor == 'Dominickofi00'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      CI: 'true'
      NO_COLOR: '1'
      S5_SCRIPTS: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned OpenCode CLI
        run: npm install --global @opencode/cli@2.0.26 --no-fund --no-audit > "$RUNNER_TEMP/npm.log" 2>&1
      - name: Run private fleet operation
        run: python3 scripts/fleet.py worker
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
