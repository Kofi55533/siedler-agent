name: neon-ref-measure
# measure/neon-ref: one-off copy of full-measure on Neon's branch SHA (antigravity/neon-scripted-start); results to rm-neonref-measure-<sha10>, not read by the scoreboard.
# Full deep measurement of clean/integration (all scenarios in scripts/measure/shards.txt: snapshot, hidden task
# fields, mid-turn RNG draws, deep world state, Lua, spatial), the same measurement as neon-full-measure.yml on the branch
# neon/full-measure-once. Results go to the private release rm-full-measure-<sha10> in
# Kofi55533/siedler-data, which the scoreboard reads; scoreboard.yml runs again when this workflow completes.
# Manual only: Neon decides when the runners measure. Start it with a push to the branch measure/now (or a dispatch).
# The gate job takes ~20 s and skips when the clean/integration head already has a full measurement.
# Privacy: logs print only fixture names, status words and turn counts (scripts/measure/sanitize.py); full diagnostics
# and the s5verify binary go only to private releases in siedler-data. The binary release is deleted afterwards.
# After each completed measurement, archive-logs commits the measure-*.txt files (plus summary.tsv and the Actions log when it is under 50 MB) to branch
# diagnostics/measure-logs in Kofi55533/siedler-data as regular files, in a folder named <sha10>-run<run_id>. It reuses secrets.PRIVATE_REPO_TOKEN
# (already used to write the siedler-data releases). It does not merge and does not start another measurement.
on:
  push:
    branches: ['measure/now']
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-char commit SHA in siedler-sim-rs'
        required: false
        default: '49d981b81f84dcafaa8985c967c6093d77945287'
      mode:
        description: 'full (all 176) or fast (affected + smoke subset)'
        required: false
        default: 'full'
      deep_every:
        description: 'Optional S5_DEEP_EVERY override (empty = total_turns/5)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: neon-ref-measure
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
      full_sha: ${{ steps.g.outputs.full_sha }}
      rel_prefix: ${{ steps.g.outputs.rel_prefix }}
    steps:
      - id: g
        env:
          GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          EV: '${{ github.event_name }}'
          IN_SHA: '${{ inputs.target_sha }}'
          IN_MODE: '${{ inputs.mode }}'
        run: |
          set -uo pipefail
          D=Kofi55533/siedler-data
          full="${IN_SHA:-49d981b81f84dcafaa8985c967c6093d77945287}"
          [ -n "$full" ] || { echo "go=false" >> "$GITHUB_OUTPUT"; echo "target SHA empty"; exit 0; }
          sha=${full:0:10}
          mode="${IN_MODE:-full}"
          prefix="rm-neonref-measure"
          [ "$mode" = "fast" ] && prefix="rm-neonref-fast"
          echo "full_sha=$full" >> "$GITHUB_OUTPUT"
          echo "rel_prefix=$prefix" >> "$GITHUB_OUTPUT"
          n=0
          if [ "$mode" != "fast" ]; then
            for tag in "${prefix}-${sha}"; do
              c=$(gh api "repos/$D/releases/tags/$tag" --jq '[.assets[]|select(.name|startswith("measure-"))]|length' 2>/dev/null || true)
              [[ "$c" =~ ^[0-9]+$ ]] || c=0
              [ "$c" -gt "$n" ] && n=$c
            done
          fi
          go=false
          if [ "$n" -ge 150 ]; then why="head $sha already measured ($n files)"
          else go=true; why="manual start ($EV, mode=$mode)"; fi
          echo "neon ref @$sha: go=$go ($why)"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.b.outputs.sha }}
      full_sha: ${{ steps.b.outputs.full_sha }}
      shards: ${{ steps.b.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup toolchain and build cache (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh clean/integration 1
      - id: b
        name: Build s5verify once and upload binary to private siedler-data release
        env:
          GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          WANT: '${{ needs.gate.outputs.full_sha }}'
          IN_MODE: '${{ inputs.mode }}'
          CARGO_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          source scripts/s5-env.sh
          cd "$S5_REPO"
          git fetch -q origin "+refs/heads/clean/integration:refs/remotes/origin/clean/integration"
          git fetch -q origin "$WANT"
          git checkout -q --detach "$WANT"
          test "$(git rev-parse HEAD)" = "$WANT"
          SHA=$(git rev-parse --short=10 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          echo "Measuring neon ref @ $SHA"
          cd "$GITHUB_WORKSPACE"
          if ! scripts/s5-build.sh; then
            echo "=== build failed; the build log tail goes to the private release measure-buildlog ==="
            tail -n 200 "$S5/build.log" > "/tmp/build-$SHA.txt" 2>/dev/null || true
            gh release view measure-buildlog -R Kofi55533/siedler-data >/dev/null 2>&1 || gh release create measure-buildlog -R Kofi55533/siedler-data --prerelease --title measure-buildlog --notes "Build log tails of failed automatic measurements" >/dev/null 2>&1 || true
            gh release upload measure-buildlog -R Kofi55533/siedler-data --clobber "/tmp/build-$SHA.txt" >/dev/null 2>&1 || true
            exit 1
          fi
          zstd -q -3 "$S5_REPO/recomp/target/release/s5verify" -o /tmp/s5verify.zst
          (cd "$UNICORN_LIB_DIR" && tar -chf - libunicorn.so* | zstd -q -3 -o /tmp/libunicorn.tzst)
          REL="measure-bin-$SHA"
          D="Kofi55533/siedler-data"
          gh release view "$REL" -R "$D" >/dev/null 2>&1 || gh release create "$REL" -R "$D" --prerelease --title "$REL" --notes "Temporary s5verify binary for $SHA" >/dev/null 2>&1 || true
          for i in 1 2 3; do
            gh release upload "$REL" -R "$D" --clobber /tmp/s5verify.zst /tmp/libunicorn.tzst >/dev/null 2>&1 && break
            sleep 10
          done
          if [ "${IN_MODE:-full}" = "fast" ]; then
            SHARDS=$(printf '%s\n' \
              "combat-waves combat-big combat-long combat" \
              "genb-waves-assault genc-combatwaves-5000 map-supplylines map-mornheim" \
              "campaign-03-thebeautifulland gen-diplomacy-tribute gen-upgrade-building-category map-spreadland map-sandbox" \
              "build production build-long production-long" \
              "gen-attack-pos gen-attack-building gen-civilian-death gen-enter-building-0x1500d gen-formation-command" \
              "gen-leader-aggressive gen-leader-attach gen-leader-defend gen-leader-guard gen-leader-hold gen-leader-patrol gen-leader-stance" \
              "gen-siege-cannon genb-combat-ops gen-player-commands gen-upgrade-research gen-cancel-research" \
              "ai-long" \
              "genb-ailong-mixed gen-49b46d-event14004 gen-a-wintersturm gen-weather-time-short" \
              "saveload-settled-long" \
              | jq -R . | jq -sc .)
          else
            SHARDS=$(grep -v '^#' scripts/measure/shards.txt | grep . | jq -R . | jq -sc .)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  measure:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        fx: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fast setup (data-v2 + prebuilt s5verify, no Rust compile)
        env:
          T: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          SHA: '${{ needs.build.outputs.sha }}'
          FULL_SHA: '${{ needs.build.outputs.full_sha }}'
        run: |
          set -euo pipefail
          source scripts/s5-env.sh
          (sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost >/dev/null 2>&1 || true) & RM_PID=$!
          sudo mkdir -p "$S5" && sudo chown "$(id -u):$(id -g)" "$S5"
          command -v zstd >/dev/null 2>&1 || (sudo apt-get -qq update && sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y zstd >/dev/null 2>&1)
          mkdir -p "$S5/dl" "$S5/data/game" "$S5/data/art" "$S5/data/fixtures" "$S5_NF" "$S5/live" "$S5/lib"
          git clone -q --depth 1 --branch clean/integration "https://x-access-token:${T}@github.com/Kofi55533/siedler-sim-rs.git" "$S5_REPO" & GIT_PID=$!
          # Download data-v2 (skip gen.tzst since s5verify is prebuilt!) + prebuilt s5verify & libunicorn.so.2
          for try in 1 2 3 4; do
            gh release download data-v2 -R Kofi55533/siedler-data -D "$S5/dl" \
              -p 'game.tzst.*' -p 'art.tzst' -p 'fixtures.tzst' -p 'newfix*.tzst' -p 'opus-extra.tzst.*' --clobber >/dev/null && break
            [ "$try" = 4 ] && exit 1; sleep $(( try * 15 ))
          done
          (for try in 1 2 3; do gh release download "measure-bin-$SHA" -R Kofi55533/siedler-data -D "$S5/dl" -p 's5verify.zst' -p 'libunicorn.tzst' --clobber >/dev/null && break; sleep 5; done) & BIN_PID=$!
          wait $RM_PID || true
          cat "$S5/dl"/game.tzst.* | zstd -dcq | tar -xf - -C "$S5/data/game" & P1=$!
          zstd -dcq "$S5/dl/art.tzst" | tar -xf - -C "$S5/data/art" & P2=$!
          zstd -dcq "$S5/dl/fixtures.tzst" | tar -xf - -C "$S5/data/fixtures" & P3=$!
          zstd -dcq "$S5/dl/newfix.tzst" | tar -xf - -C "$S5_NF" & P4=$!
          P5=""
          for f in "$S5/dl"/newfix[0-9]*.tzst; do
            [ -f "$f" ] && { zstd -dcq "$f" | tar -xf - -C "$S5_NF" & P5="$P5 $!"; }
          done
          wait $GIT_PID $BIN_PID
          git -C "$S5_REPO" fetch -q --depth 1 origin "$FULL_SHA"
          git -C "$S5_REPO" checkout -q --detach "$FULL_SHA"
          test -f "$S5_REPO/crates/s5clean/../../ref/game_config/extra2/tllist.xml"
          mkdir -p "$S5_REPO/recomp/target/release"
          zstd -dcq "$S5/dl/s5verify.zst" > "$S5_REPO/recomp/target/release/s5verify"
          chmod +x "$S5_REPO/recomp/target/release/s5verify"
          zstd -dcq "$S5/dl/libunicorn.tzst" | tar -xf - -C "$S5/lib"
          wait $P1 $P2 $P3 $P4 $P5
          ls "$S5/dl"/opus-extra.tzst.* >/dev/null 2>&1 && { cat "$S5/dl"/opus-extra.tzst.* | zstd -dcq | tar -x --skip-old-files --strip-components=2 -C "$S5_NF" artifacts/new-fixtures 2>/dev/null || true; }
          rm -rf "$S5_NF/fixtures/map-sandbox" "$S5_NF/images/map-sandbox"
          sed -i -e "s#/workspace/siedler/artifacts/new-fixtures#$S5_NF#g" -e "s#/workspace/siedler/artifacts/codex-verify-infra#$S5_V#g" "$S5_NF"/fixtures/*/scenario.json
          rm -f "$S5/dl"/*.tzst* "$S5/dl"/s5verify.zst
          echo "setup complete for $SHA"
      - name: Measure shard (snapshot + tasks + mid-turn RNG + deep + Lua + spatial)
        env:
          GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          FX: '${{ matrix.fx }}'
          SHA: '${{ needs.build.outputs.sha }}'
          S5_DEEP_EVERY: '${{ inputs.deep_every }}'
        run: |
          set -uo pipefail
          D="$GITHUB_WORKSPACE/scripts"
          source "$D/s5-env.sh"
          export LD_LIBRARY_PATH="$S5/lib:$UNICORN_LIB_DIR:${LD_LIBRARY_PATH:-}"
          mkdir -p "$S5/measure/r"
          known(){ local b=${1%-mapstart}; [ -f "$S5_V/fixtures/$b/scenario.json" ] || [ -f "$S5_NF/fixtures/$b/scenario.json" ]; }
          ok=""
          for x in $FX; do
            if "$D/s5-fixture-install.sh" "$x" >> "$S5/measure/install.txt" 2>/dev/null || known "$x"; then
              ok="$ok $x"
            else
              # Try downloading the start image from the private mapimg release in siedler-data
              base="${x%-mapstart}"
              if gh release download mapimg -R Kofi55533/siedler-data -p "$base.tzst" -D "$S5/dl" --clobber >/dev/null 2>&1; then
                mkdir -p "$S5/dl/mi-$base" "$S5_NF/images/$base"
                zstd -dcq "$S5/dl/$base.tzst" | tar -xf - -C "$S5/dl/mi-$base" 2>/dev/null || true
                imgf=$(find "$S5/dl/mi-$base" -name 'start.img' | head -n1)
                if [ -n "$imgf" ] && [ -f "${imgf}.state.json" ]; then
                  mv "$imgf" "$S5_NF/images/$base/start.img"
                  mv "${imgf}.state.json" "$S5_NF/images/$base/start.img.state.json"
                fi
                rm -rf "$S5/dl/mi-$base" "$S5/dl/$base.tzst"
              fi
              if "$D/s5-fixture-install.sh" "$x" >> "$S5/measure/install.txt" 2>/dev/null || known "$x"; then
                ok="$ok $x"
              else
                echo "$x: NOT_INSTALLABLE"
              fi
            fi
          done
          run_one() {
            local f="$1" base="${1%-mapstart}" a sc img rc line
            case "$f" in wintersturm|economy|*-mapstart) a="$base" ;; *) a=image ;; esac
            sc="$S5_V/fixtures/$base/scenario.json"
            case "$base" in
              bc-full) img="$S5_ARTIFACTS/bc/gs_h.img" ;;
              build|production) img="$S5_V/images/wsecon/start.img" ;;
              wsecon) img="$S5_V/images/wsecon-direct/start.img" ;;
              wintersturm|economy|combat) img="$S5_V/images/$base/start.img" ;;
              *) sc="$S5_NF/fixtures/$base/scenario.json"
                 img=$(python3 -c "import json;print(json.load(open('$sc'))['image'])") ;;
            esac
            cd "$S5_REPO/recomp"
            export S5_REMAP=$(python3 -c "import verify; print(verify.remap_for('$img', 'target/verify/measure-$f'))")
            [ "$a" = economy ] && export S5_CLEAN_MAP_DIR="$S5_V/maps/economy/maps/externalmap"
            timeout 7000 ./target/release/s5verify measure-live ../data/scope/schema.json "$sc" "$img" "$a" > "$S5/live/$f.log" 2>&1
            rc=$?
            line=$(grep -m1 -E "^[a-zA-Z0-9_-]+: (IDENTICAL|DEEP-DIVERGENT|DIVERGENT)" "$S5/live/$f.log" | sed -E 's/^[^:]+: //')
            if [ -z "$line" ]; then
              line="ERROR exit=$rc"
            fi
            # Strip any field strings from public stdout; keep only safe status + turn/draw/checkpoint counts
            safe=$(python3 "$GITHUB_WORKSPACE/scripts/measure/sanitize.py" "$line")
            echo "$f: $safe" | tee "$S5/measure/r/$f"
          }
          export -f run_one
          # Parallelism: 1 if single-fixture shard, else up to 2 (memory safe with two engines)
          count=$(wc -w <<<"$ok")
          PAR=2
          [ "$count" -le 1 ] && PAR=1
          t0=$(date +%s)
          printf '%s\n' $ok | xargs -P "$PAR" -I{} bash -c 'run_one "$1"' _ {}
          echo "shard done ($count fixtures) in $(( $(date +%s) - t0 ))s"
      - name: Upload full diagnostics to private siedler-data release
        if: always()
        env:
          GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          FX: '${{ matrix.fx }}'
          SHA: '${{ needs.build.outputs.sha }}'
          REL_PREFIX: '${{ needs.gate.outputs.rel_prefix }}'
        run: |
          source scripts/s5-env.sh
          mkdir -p /tmp/up
          for x in $FX; do
            l="$S5/live/$x.log"
            o="/tmp/up/measure-$x.txt"
            {
              echo "fixture $x on neon ref @$SHA"
              if [ -f "$l" ]; then
                head -n 200 "$l"
              else
                echo "no log"
              fi
            } > "$o" 2>/dev/null || true
          done
          REL="${REL_PREFIX}-${SHA}"
          D="Kofi55533/siedler-data"
          gh release view "$REL" -R "$D" >/dev/null 2>&1 || gh release create "$REL" -R "$D" --prerelease --title "$REL" --notes "Automatic full deep measurement for $SHA" >/dev/null 2>&1 || true
          for i in 1 2 3 4; do
            gh release upload "$REL" -R "$D" --clobber /tmp/up/measure-*.txt >/dev/null 2>&1 && break
            sleep $((i * 10))
          done
          echo "uploaded diagnostics to private release $REL"

  cleanup:
    needs: [build, measure]
    if: always() && needs.build.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the temporary binary release
        env:
          GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}'
          SHA: '${{ needs.build.outputs.sha }}'
        run: gh release delete "measure-bin-$SHA" -R Kofi55533/siedler-data -y --cleanup-tag >/dev/null 2>&1 || true

  archive-logs:
    needs: [gate, build, measure]
    if: always() && needs.build.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Commit measure logs to siedler-data branch diagnostics/measure-logs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SHA: ${{ needs.build.outputs.sha }}
          FULL_SHA: ${{ needs.build.outputs.full_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REL: ${{ needs.gate.outputs.rel_prefix }}-${{ needs.build.outputs.sha }}
          LABEL: neon ref
        run: |
          set -euo pipefail
          # Reuse PRIVATE_REPO_TOKEN (already used to write siedler-data releases). Do not set -x.
          DATA=Kofi55533/siedler-data
          BRANCH=diagnostics/measure-logs
          DIR="${SHA}-run${RUN_ID}"
          WORK=/tmp/measure-archive
          rm -rf "$WORK"
          mkdir -p "$WORK/files"
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release download "$REL" -R "$DATA" -D "$WORK/files" -p 'measure-*.txt' --clobber >/dev/null 2>&1; then
              n=$(find "$WORK/files" -name 'measure-*.txt' -type f | wc -l)
              if [ "$n" -gt 0 ]; then
                echo "downloaded $n measure files from $REL"
                ok=1
                break
              fi
            fi
            sleep $((i * 10))
          done
          if [ "$ok" != 1 ]; then
            echo "no measure assets downloaded for $REL"
            exit 1
          fi
          if gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$WORK/files/run-${RUN_ID}.log" 2>"$WORK/log.err"; then
            sz=$(wc -c < "$WORK/files/run-${RUN_ID}.log")
            if [ "$sz" -gt 50000000 ]; then
              echo "omitting actions log ($sz bytes, over 50 MB)"
              rm -f "$WORK/files/run-${RUN_ID}.log"
            else
              echo "saved actions log ($sz bytes)"
            fi
          else
            echo "actions log not fetched (not fatal)"
            rm -f "$WORK/files/run-${RUN_ID}.log"
          fi
          DATE=$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')
          export DIR SHA FULL_SHA RUN_ID RUN_URL REL LABEL DATE
          python3 - <<'PY'
          import os, re, collections, pathlib
          files = pathlib.Path("/tmp/measure-archive/files")
          rows = []
          for p in sorted(files.glob("measure-*.txt")):
              scenario = p.name[len("measure-"):-len(".txt")]
              text = p.read_text(errors="replace")
              verdict, first = "NO-RESULT", ""
              for line in text.splitlines():
                  m = re.match(r"^[A-Za-z0-9_-]+: (IDENTICAL|DEEP-DIVERGENT|DIVERGENT)(.*)$", line)
                  if m:
                      verdict, rest = m.group(1), m.group(2)
                      if verdict == "DIVERGENT":
                          tm = re.search(r"turn (\d+)", rest) or re.search(r"turn (\d+)", text)
                          first = f"turn {tm.group(1)}" if tm else rest.strip()
                      elif verdict == "DEEP-DIVERGENT":
                          pairs = [(c, int(t)) for c, t in re.findall(r"([a-z_]+)@(\d+)", rest)]
                          pairs.sort(key=lambda z: (z[1], z[0]))
                          first = ",".join(f"{c}@{t}" for c, t in pairs) if pairs else rest.strip()
                      break
                  m2 = re.match(r"^[A-Za-z0-9_-]+: ERROR(.*)$", line)
                  if m2:
                      verdict = "ERROR"
                      first = m2.group(1).strip()
                      for l2 in text.splitlines():
                          if l2.startswith("s5verify:") or "starts at" in l2:
                              first = (first + "; " if first else "") + l2.strip()
                              break
                      break
              if verdict == "NO-RESULT":
                  for l2 in text.splitlines():
                      if l2.startswith("s5verify:") or "starts at" in l2:
                          verdict, first = "ERROR", l2.strip()
                          break
              rows.append((scenario, verdict, first))
          counts = collections.Counter(v for _, v, _ in rows)
          (files / "summary.tsv").write_text(
              "scenario\tverdict\tfirst_divergence\n" + "".join(f"{s}\t{v}\t{f}\n" for s, v, f in rows)
          )
          n_txt = sum(1 for _ in files.glob("measure-*.txt"))
          order = ("IDENTICAL", "DEEP-DIVERGENT", "DIVERGENT", "ERROR", "NO-RESULT")
          result = ", ".join(f"{counts[k]} {k}" for k in order if counts.get(k, 0))
          has_log = (files / f"run-{os.environ['RUN_ID']}.log").exists()
          rel = os.environ["REL"]
          lines = [
              f"# Messprotokolle: {os.environ['LABEL']} `{os.environ['SHA']}`",
              "",
              "Automatisch abgelegte Ergebnisdateien eines full-measure-Laufs, als normale Textdateien.",
              "",
              "| Feld | Wert |",
              "|---|---|",
              f"| Gemessener Commit | `{os.environ.get('FULL_SHA') or os.environ['SHA']}` |",
              f"| Label | {os.environ['LABEL']} |",
              f"| Actions-Run | [{os.environ['RUN_ID']}]({os.environ['RUN_URL']}) |",
              f"| Zeitpunkt (Europe/Berlin) | {os.environ['DATE']} |",
              f"| Private Release | [{rel}](https://github.com/Kofi55533/siedler-data/releases/tag/{rel}) |",
              "",
              "## Ergebnis",
              "",
              f"{n_txt} Szenario-Protokolle. {result}. Siehe `summary.tsv`.",
              "",
              "### Bedeutung der Verdicts",
              "",
              "- **IDENTICAL:** Spielzustand (Snapshot, Tasks, RNG) und die zusätzlichen Prüfungen (Lua-Speicher, Weltdaten) stimmen an allen Checkpoints überein.",
              "- **DEEP-DIVERGENT:** Spielzustand und RNG sind identisch, aber Lua-Speicher und/oder Weltdaten weichen ab. Die erste Abweichung steht in `summary.tsv`.",
              "- **DIVERGENT:** Der Spielzustand selbst weicht ab.",
              "- **ERROR:** Die Messung selbst ist fehlgeschlagen, kein Vergleichsergebnis.",
              "",
              "## Dateien",
              "",
              "- `measure-*.txt` — ein Protokoll pro Szenario (die ersten 80 Zeilen des `s5verify measure-live`-Logs).",
              "- `summary.tsv` — Spalten: `scenario`, `verdict`, `first_divergence`.",
          ]
          if has_log:
