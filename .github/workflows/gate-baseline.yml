name: gate-baseline
run-name: gate-baseline ${{ inputs.mode }} ${{ inputs.pr }}
# Warms the s5-gate baseline cache (release gate-baseline, base-<key>.tsv) for the current clean/integration code tree,
# so worker gates only measure the PR side. Dispatched by refill.yml when no warm-up runs; exits after a ~20 s
# pre-check when the key is cached. mode=check-old|check-new runs a DRY-RUN gate on input pr (no merge, no comment)
# with the pre-2026-10-20 script (commit 06c8174) or the current one, for verdict-equivalence checks.
# mode=remeasure (pr = optional space-separated fixture list): genb/genc re-measure on clean/integration without an LLM
# (scripts/s5-remeasure.sh; one board entry in scoreboard format). Dispatched by refill every 3 h.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'warm | check-old | check-new | verify-merge | regate | remeasure', default: 'warm' }
      pr: { description: 'PR number (check modes) or merge commit sha (verify-merge)', default: '' }
permissions:
  contents: read
jobs:
  precheck:
    if: inputs.mode == 'warm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      need: ${{ steps.k.outputs.need }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          sudo mkdir -p /opt/s5 && sudo chown "$(id -u):$(id -g)" /opt/s5
          git clone -q --depth 1 -b clean/integration "https://x-access-token:${T}@github.com/Kofi55533/siedler-sim-rs.git" /opt/s5/siedler-sim-rs
          r=$(S5_GATE_BASELINE_ONLY=1 S5_GATE_KEY_ONLY=1 S5_GATE_COMMENT=0 S5_LIVE_TIMEOUT=900 scripts/s5-gate.sh baseline | tail -n1)
          echo "baseline key: $r"
          # "skip": data-v2/cache asset list unreadable (API rate limit) -> no warm-up this time (refill retries every 5 min)
          case "$r" in *" hit"|*" skip") echo need=false >> "$GITHUB_OUTPUT" ;; *) echo need=true >> "$GITHUB_OUTPUT" ;; esac
  warm:
    needs: precheck
    if: needs.precheck.outputs.need == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: gate-baseline-warm, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh codex/clean-commands 1
      - name: Baseline live matrix (parallel) -> cache
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          t0=$(date +%s)
          S5_GATE_BASELINE_ONLY=1 S5_GATE_COMMENT=0 S5_LIVE_TIMEOUT=900 scripts/s5-gate.sh baseline
          echo "warm secs=$(( $(date +%s)-t0 ))"
  check:
    if: inputs.mode == 'check-old' || inputs.mode == 'check-new'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          scripts/s5-setup.sh codex/clean-commands 1
          scripts/s5-build.sh || true
      - name: Dry-run gate (${{ inputs.mode }})
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          G=scripts/s5-gate.sh
          if [ "${{ inputs.mode }}" = check-old ]; then git fetch -q --depth 50 origin main; git show 06c8174:scripts/s5-gate.sh > scripts/s5-gate-old.sh; chmod +x scripts/s5-gate-old.sh; G=scripts/s5-gate-old.sh; fi
          t0=$(date +%s)
          S5_GATE_COMMENT=0 S5_LIVE_TIMEOUT=900 timeout 170m $G "${{ inputs.pr }}" --dry-run || true
          echo "gate secs=$(( $(date +%s)-t0 ))"
  verify-merge:
    # post-hoc: live matrix of a merge commit vs its first parent (both cached as baselines), no-regression verdict
    if: inputs.mode == 'verify-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh codex/clean-commands 1
      - name: Parent vs merge commit
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}', M: '${{ inputs.pr }}' }
        run: |
          source scripts/s5-env.sh
          git -C $S5_REPO fetch -q --depth 3 origin "$M"
          P=$(git -C $S5_REPO rev-parse "$M^1"); M=$(git -C $S5_REPO rev-parse "$M")
          for c in $P $M; do S5_GATE_BASE_REF=$c S5_GATE_BASELINE_ONLY=1 S5_GATE_COMMENT=0 S5_LIVE_TIMEOUT=900 scripts/s5-gate.sh verify-${c:0:8} | grep -E '^(live|baseline)'; done
          reg=0
          while read -r f n0 _; do n1=$(awk -v f=$f '$1==f{print $2}' $S5/baseline-${M:0:12}.tsv)
            if [ -z "$n1" ] || [ "$n1" -lt "$n0" ]; then s=REGRESSION; reg=1; elif [ "$n1" -gt "$n0" ]; then s=better; else s=same; fi
            printf '%-22s parent %-9s merge %-9s %s\n' $f $n0 ${n1:--} $s
          done < $S5/baseline-${P:0:12}.tsv
          echo "verdict: $([ $reg = 0 ] && echo 'no fixture earlier (merge OK)' || echo 'REGRESSION')"
  regate:
    # re-run the normal self-merge gate (same criteria, comments + merges on PASS) for a PR whose last verdict was a lane-claim
    # hold; dispatched by refill. A cheap claim check runs first, so a still-held PR costs ~1 min instead of the full setup.
    if: inputs.mode == 'regate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: gate-regate-${{ inputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Lane-claim pre-check (no setup)
        id: pre
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}', PR: '${{ inputs.pr }}' }
        run: |
          set -u
          git clone -q --filter=blob:none --no-checkout "https://x-access-token:${T}@github.com/Kofi55533/siedler-sim-rs.git" /tmp/sr
          cd /tmp/sr
          git fetch -q origin "+refs/pull/$PR/head:refs/gate/pr" '+refs/heads/codex/*:refs/remotes/origin/codex/*' '+refs/heads/opus/*:refs/remotes/origin/opus/*'
          # API rate limit (2026-10-20 13:00-13:26 the account hit 5000/5000): a failed lookup decides nothing -> go=false with
          # "deferred" (no gate comment; the PR's last verdict stays, refill re-dispatches after 90 min)
          rl_hit(){ local r; r=$(gh api rate_limit -q '"\(.resources.core.remaining) \(.resources.graphql.remaining)"' 2>/dev/null) || return 1; [ "${r%% *}" = 0 ] || [ "${r##* }" = 0 ]; }
          j=$(gh pr view "$PR" -R Kofi55533/siedler-sim-rs --json state,files,createdAt) || { echo "deferred: pr lookup failed$(rl_hit && echo ' (API rate limit)')"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$(jq -r .state <<<"$j")" = OPEN ] || { echo "PR not open"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; }
          jq -r '.files[].path' <<<"$j" > /tmp/files.txt
          gh pr diff "$PR" -R Kofi55533/siedler-sim-rs > /tmp/pr.diff || { git diff "$(git merge-base origin/clean/integration refs/gate/pr)" refs/gate/pr > /tmp/pr.diff && echo "pr diff: local git"; } || { echo "deferred: no PR diff"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; }
          git show origin/clean/integration:docs/AGENT_BOARD.md > /tmp/board.md
          # Codex claims hold only while the Codex box loop heartbeat is active (scripts/heartbeat.sh)
          read -r -a HB <<<"$("$GITHUB_WORKSPACE/scripts/heartbeat.sh" fetch /tmp/heartbeat.json)"; echo "heartbeat: ${HB[*]}"
          lc=$(python3 "$GITHUB_WORKSPACE/scripts/lane-claims.py" /tmp/board.md /tmp/files.txt --owners Opus,Codex --hours 6 --repo /tmp/sr --diff /tmp/pr.diff \
                 --old-rev "$(git merge-base origin/clean/integration refs/gate/pr)" --new-rev refs/gate/pr --pr-created "$(jq -r .createdAt <<<"$j")" "${HB[@]}")
          if [ -n "$lc" ] && [ "${HB[0]:-}" = --heartbeat-unknown ] && rl_hit; then echo "deferred: heartbeat unknown under API rate limit, claim undecided: $lc"; echo go=false >> "$GITHUB_OUTPUT"
          elif [ -n "$lc" ]; then echo "still held: $lc"; echo go=false >> "$GITHUB_OUTPUT"; else echo "no claim holds PR #$PR -> full gate"; echo go=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.pre.outputs.go == 'true'
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        if: steps.pre.outputs.go == 'true'
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          scripts/s5-setup.sh codex/clean-commands 1
          scripts/s5-build.sh || true
      - name: Self-merge gate
        if: steps.pre.outputs.go == 'true'
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: S5_GATE_BUDGET_MIN=96 S5_LIVE_TIMEOUT=900 timeout 100m scripts/s5-gate.sh "${{ inputs.pr }}" || true
  remeasure:
    if: inputs.mode == 'remeasure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: gate-remeasure, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh codex/clean-commands 1
      - name: Re-measure genb/genc on clean/integration (no LLM)
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}', FX: '${{ inputs.pr }}' }
        run: S5_LIVE_TIMEOUT=900 timeout 100m scripts/s5-remeasure.sh $FX
