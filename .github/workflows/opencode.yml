name: opencode
# Compatibility inbox for requests emitted by planners still running at cutover.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: legacy-inbox-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  admit:
    if: >-
      contains(github.event.comment.body, '/opencode') &&
      (github.event.comment.user.login == 'Kofi55533' || github.event.comment.user.login == 'Dominickofi00') &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Hand request to private shared planner
        run: python3 scripts/fleet.py admit-legacy
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          LEGACY_ISSUE: ${{ github.event.issue.number }}
          LEGACY_TITLE: ${{ github.event.issue.title }}
          LEGACY_BODY: ${{ github.event.issue.body }}
          LEGACY_COMMENT: ${{ github.event.comment.body }}
