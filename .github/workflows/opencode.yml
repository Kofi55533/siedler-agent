name: opencode
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  run:
    if: >-
      vars.FLEET_V2_ENABLED != 'true' &&
      contains(github.event.comment.body, '/opencode') &&
      github.event.comment.user.login == 'Kofi55533' &&
      github.event.issue.user.login == 'Kofi55533' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # planner runs ([planner] issues) only read GitHub state + the siedler-sim-rs git history: slim setup, no game data,
      # no siedler-forschung, no build; scripts/planner_state.py precomputes their state file
      PLANNER: ${{ startsWith(github.event.issue.title, '[planner]') }}
    steps:
      - name: Runner specs
        run: |
          echo "T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "W=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          echo "nproc=$(nproc)"; free -h | head -2
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup game data, toolchain, build cache (quiet)
        if: env.PLANNER != 'true'
        env:
          T: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          # siedler-forschung clone runs in parallel with the data/toolchain setup (was a separate ~1.8 min step)
          mkdir -p "$W"
          ( cd "$W" && git clone -q --depth 1 --filter=blob:limit=5m --no-checkout "https://x-access-token:${T}@github.com/Kofi55533/siedler-forschung.git" siedler-forschung \
              && git -C siedler-forschung sparse-checkout set --no-cone '/*' '!/cloud-re/' && git -C siedler-forschung checkout -q main && touch "$RUNNER_TEMP/forschung.ok" ) > "$RUNNER_TEMP/forschung.log" 2>&1 &
          FP=$!
          scripts/s5-setup.sh codex/clean-commands 1
          wait $FP && echo "forschung clone ok" || echo "forschung clone failed (retried in next step)"
          echo "S5_SCRIPTS=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_ENV"
      - name: Planner slim setup (siedler-sim-rs clone only)
        if: env.PLANNER == 'true'
        env:
          T: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          t0=$(date +%s)
          sudo mkdir -p /opt/s5 && sudo chown "$(id -u):$(id -g)" /opt/s5
          git clone -q --depth 1 --no-single-branch "https://x-access-token:${T}@github.com/Kofi55533/siedler-sim-rs.git" /opt/s5/siedler-sim-rs
          git -C /opt/s5/siedler-sim-rs checkout -q --detach origin/clean/integration
          echo "S5_SCRIPTS=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_ENV"
          mkdir -p "$W" && ln -s /opt/s5/siedler-sim-rs "$W/siedler-sim-rs"
          git config --global user.name "siedler-agent"
          git config --global user.email "Kofi55533@users.noreply.github.com"
          git config --global core.hooksPath "$GITHUB_WORKSPACE/scripts/hooks"  # append-only board guard
          git -C /opt/s5/siedler-sim-rs rev-parse origin/clean/integration > "$RUNNER_TEMP/board-start.sha"
          echo "planner setup secs=$(( $(date +%s)-t0 ))"
      - name: Planner state file
        if: env.PLANNER == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 scripts/planner_state.py "$W" /opt/s5/siedler-sim-rs
      - name: Workdir + siedler-forschung check (clone if the background clone failed)
        if: env.PLANNER != 'true'
        env:
          T: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p "$W" && cd "$W"
          git config --global user.name "siedler-agent"
          git config --global user.email "Kofi55533@users.noreply.github.com"
          # append-only board guard (pre-push hook) + start sha for the post-run repair step
          git config --global core.hooksPath "$GITHUB_WORKSPACE/scripts/hooks"
          git -C /opt/s5/siedler-sim-rs fetch -q origin clean/integration && git -C /opt/s5/siedler-sim-rs rev-parse origin/clean/integration > "$RUNNER_TEMP/board-start.sha" || true
          ln -s /opt/s5/siedler-sim-rs siedler-sim-rs
          if [ ! -e "$RUNNER_TEMP/forschung.ok" ]; then
            rm -rf siedler-forschung
            git clone -q --depth 1 --filter=blob:limit=5m --no-checkout "https://x-access-token:${T}@github.com/Kofi55533/siedler-forschung.git" siedler-forschung
            git -C siedler-forschung sparse-checkout set --no-cone '/*' '!/cloud-re/'
            git -C siedler-forschung checkout -q main
          fi
          df -h / | awk 'NR==2{print "disk_free="$4}'
      - name: Baseline build (quiet)
        if: env.PLANNER != 'true'
        run: $S5_SCRIPTS/s5-build.sh || true
      - name: Install opencode
        run: npm i -g opencode-ai >/dev/null 2>&1 && opencode --version
      - name: Run opencode (output not shown, not uploaded)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          BODY: ${{ github.event.comment.body }}
          TITLE: ${{ github.event.issue.title }}
          IBODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p ~/.local/share/opencode
          umask 077
          printf '{"opencode":{"type":"api","key":"%s"}}' "$OPENCODE_API_KEY" > ~/.local/share/opencode/auth.json
          unset OPENCODE_API_KEY
          cat > "$W/opencode.json" <<'J'
          {"$schema":"https://opencode.ai/config.json","permission":{"edit":"allow","bash":"allow","webfetch":"allow","external_directory":"allow"}}
          J
          TASK="${BODY#*/opencode}"
          # queued planner tasks carry their /opencode text in the body too (refill posts it); do not repeat it
          IBODY="${IBODY%%---PLANNER-COMMENT---*}"
          cat > "$RUNNER_TEMP/prompt.txt" <<P
          You work in $W containing private repos siedler-sim-rs/ (symlink) and siedler-forschung/ (shallow; all branch tips of siedler-sim-rs fetched; forschung cloud-re excluded).
          RULES: Push results ONLY as new branches (prefix agent/) to those private repos and open DRAFT PRs with gh (never merge, never push to main).
          Never commit or copy private content anywhere else. siedler-sim-rs real path is /opt/s5/siedler-sim-rs, checked out at codex/clean-commands with a warm build (s5verify does not exist on opus/clean-rewrite; switching branches triggers a ~6 min rebuild).
          TOP PRIORITY (Opus decision 2026-10-18): progress is measured by FRONTIERS = first-divergence turns of the live scenarios and
          generated fixtures (read current numbers from docs/AGENT_BOARD.md / live; e.g. gen-campaign 16, gen-recruit-attack 31, combat set
          166-173, gen-a-dunkelforst 331, gen-a-wintersturm 1352, bc-full 1501). Every run works on ONE frontier or on functions the reference
          executes within +-50 turns of a current frontier. Frontier diagnosis: tools/deepdiff.sh (siedler-sim-rs) at the first divergent turn,
          find the first differing entity+field, trace it to the native handler address and the expected values; then land a minimal WIRED fix
          (hooked into World tick/dispatch) that moves the boundary, or, if a fresh Opus/Codex LANE-CLAIM covers the file, post a precise wiring
          request on docs/AGENT_BOARD.md (addresses, expected values, file+function to touch, fixture+turn). Per-window divergence census:
          tools/census.sh; executed native functions per fixture: tools/coverage_map.sh. No doc-only analysis PRs, no unwired helpers,
          no PRs that only document an "inert helper", no ports of functions no frontier reaches.
          WORK SPLIT + WIP (Opus decision 2026-10-18 20:40): runs are split 50% frontier diagnosis, 20% ports, 10% scenarios,
          20% hygiene (get open siedler-sim-rs PRs below 60: close stale/superseded agent/* drafts and duplicates with a one-line reason
          comment, never opus/codex/haiku heads or needs-codex PRs, branches kept; rebase green ones so the gate merges them).
          At most 1 open PR per run: if an open agent/* PR already covers your lane/fixture, push to it (or stop) instead of opening another.
          Scenario PRs merge only if they reach a new code path or a new unmodelled marker: add a PR body line "New-code-path: <address/subsystem>"
          or "New-unmodelled: <marker>"; a pure stay-IDENTICAL time extension of a covered path no longer counts and is not merged.
          Frontier PRs (title "Diverge ..." or a "Frontier-fixture:" line) must state "live <fixture>: before turn X -> after turn Y" in the
          PR body, otherwise the gate does not merge them.
          LIVE VERIFICATION (mandatory for code changes): game data, recomp artifacts and fixtures are installed. Scripts in $S5_SCRIPTS:
            source $S5_SCRIPTS/s5-env.sh ; $S5_SCRIPTS/s5-build.sh (incremental s5verify build, ~minutes) ;
            $S5_SCRIPTS/s5-live.sh <fixture> (full output in /opt/s5/live/<f>.log); fixtures: bc-full wintersturm economy wsecon build production combat combat-waves combat-big combat-long ai-long late-ai late-economy camp-crawford map-winterisland wintersturm-mapstart economy-mapstart
            (all Codex box fixtures incl. ai-long, late-ai, late-economy, camp-crawford, map-winterisland, combat-waves/big/long).
          SELF-MERGE GATE / MERGE RULE (Opus decision 2026-10-18): after you open your draft PR (base clean/integration), the workflow runs
          $S5_SCRIPTS/s5-gate.sh on it. It squash-merges ONLY if s5verify builds, crates/s5clean tests pass (bit-exact unit tests vs recomp/,
          cite the original address), and NO fixture of the full live matrix diverges earlier than on clean/integration. There is NO exception
          for "Port:" PRs any more: a port that makes any scenario diverge earlier is not merged; find the missing partner function first.
          Hard-blocked (never auto-merged, stays draft for Opus/Codex): recomp/, oracle/, crates/s5verify, crates/s5diff, .github/.
          Former claimed areas (lifecycle/, net+world/commands.rs, entity/animal.rs, economy/, workers/, scenario.rs, script/, docs/agent-queue/,
          69657 extraction markers; see $S5_SCRIPTS/muse-claims.txt "soft") ARE open to you, but the gate merges such a PR only if it moves at
          least one frontier later and regresses nothing. If your target frontier is a generated fixture outside the standard matrix, add a line
          "Frontier-fixture: <name>" to the PR body (measured by the gate when installed on the runner) and report before/after in the PR body.
          LANE CLAIMS replace directory claims: a board line "LANE-CLAIM <Owner> <YYYY-MM-DD HH:MM> <file>[::<function>] ... -- <note>" (Berlin time)
          reserves that file/function for 6 hours. A fresh Opus/Codex lane claim on a file you touch keeps your PR draft; do not edit such a
          file, post a wiring request instead. You may post your own LANE-CLAIM DeepSeek line for the files you work on (advisory, 6 h).
          A fresh 'LANE-CLAIM Subsystem' line (a subsystem run porting a whole function group, e.g. battle logic) reserves exactly the
          functions it names: do not edit them; still deliver the exact next divergence (fixture, turn, entity+field, native handler,
          expected values) and post it on the board as a wiring request for that subsystem branch.
          Base your branch on origin/clean/integration, keep PRs small, never merge yourself and never target main.
          COORDINATION (mandatory, every run; Opus > Codex > Muse): first read siedler-sim-rs docs/AGENT_BOARD.md and docs/agent-queue/ (incl. started/)
          on origin/clean/integration. Before working, CLAIM your task: for a queue task use the file already moved to started/ (or move it there);
          append a one-line claim to docs/AGENT_BOARD.md ('<date> Muse claim: <task/fixture/subsystem> on agent/<branch>, issue #<n>'), commit and push
          to clean/integration (fetch+rebase and retry on conflict). If an equal or overlapping claim by Opus, Codex or another Muse instance exists
          and is not marked done, do NOT duplicate: pick nothing and say so in summary. Lanes/claims by Opus or Codex on the board always win.
          At the end append real findings/handoffs (not routine status) to the board the same way. NEVER commit docs/AGENT_BOARD.md on your
          agent/* PR branch (board edits in PRs conflict with every other PR; the push hook rejects them and the gate drops them): board lines
          go only directly to clean/integration as above. The gate announces self-merges on the board (exactly one entry per PR); never write your own self-merge entries.
          Run s5-live for the relevant fixture(s) BEFORE your change (baseline) and AFTER. Never paste live log contents or game data into PRs/comments.
          When finished, you MUST write (with a shell command) a SHORT plain-text summary (max 5 lines, no code, no file contents, no secrets)
          to $W/summary.txt including 'live <fixture>: before turn X -> after turn Y' (frontier fixes must move it; frontier-reached ports must not regress any fixture). If no changes are requested, make none.
          Issue: $TITLE
          $IBODY
          Task: $TASK
          P
          # Subsystem runs (title 'Subsystem: <id> ...', queued by refill): append the subsystem prompt variant (overrides the scope)
          case "$TITLE" in Subsystem:*) python3 "$GITHUB_WORKSPACE/scripts/subsystem_task.py" prompt "$TITLE" >> "$RUNNER_TEMP/prompt.txt" ;; esac
          # gh call log + polling floor (API budget, 2026-10-20: the shared PAT hit 5000 REST calls/h). Every gh call of the agent is
          # logged (command words only, no arguments); `gh run watch` / `gh pr checks --watch` poll every 3/10 s by default
          # (~1200 calls/h each) -> forced to --interval 60. Printed after the run as "agent gh calls".
          REALGH=$(command -v gh); mkdir -p "$RUNNER_TEMP/ghshim"; export GH_CALL_LOG="$RUNNER_TEMP/gh-calls.log"; : > "$GH_CALL_LOG"
          printf '%s\n' '#!/usr/bin/env bash' \
            'echo "$(date +%s) ${1:-} ${2:-}" >> "$GH_CALL_LOG"' \
            'w=0; i=0; for a in "$@"; do case "$a" in watch|--watch) w=1 ;; -i|--interval|--interval=*) i=1 ;; esac; done' \
            "if [ \$w = 1 ] && [ \$i = 0 ]; then exec $REALGH \"\$@\" --interval 60; fi" \
            "exec $REALGH \"\$@\"" > "$RUNNER_TEMP/ghshim/gh"
          chmod +x "$RUNNER_TEMP/ghshim/gh"; export PATH="$RUNNER_TEMP/ghshim:$PATH"
          rl0=$("$REALGH" api rate_limit -q .resources.core.used 2>/dev/null)
          cd "$W"
          set +e
          # Model per run: a 'model: opencode/<id>' line in the comment or issue body (comment wins), else default.
          MODEL=opencode/deepseek-v4.1-flash-free  # A/B 2026-10-17 winner over glm-5.3-flash-free (#504-#507)
          echo "model=$MODEL"
          timeout 200m opencode run -m "$MODEL" "$(cat "$RUNNER_TEMP/prompt.txt")" > "$RUNNER_TEMP/opencode.log" 2>&1
          echo "exit=$? log_lines=$(wc -l < "$RUNNER_TEMP/opencode.log")"
          echo "agent gh calls: $(wc -l < "$GH_CALL_LOG") in $(( ($(date +%s)-$(date -d "$T0" +%s))/60 )) min; top: $(awk '{print $2, $3}' "$GH_CALL_LOG" | sort | uniq -c | sort -rn | head -6 | awk '{printf "%s %s %s; ", $1, $2, $3}')"
          echo "PAT core used (account-wide, all consumers): start ${rl0:-?} -> now $("$REALGH" api rate_limit -q .resources.core.used 2>/dev/null)"
          rm -f ~/.local/share/opencode/auth.json
      - name: Board guard (restore lines of docs/AGENT_BOARD.md deleted during this run)
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/board-start.sha" ] || exit 0
          python3 scripts/board-guard.py repair "$(cat "$RUNNER_TEMP/board-start.sha")" /opt/s5/siedler-sim-rs | tee "$RUNNER_TEMP/board-guard.txt" || true
          grep restored "$RUNNER_TEMP/board-guard.txt" >> "$W/summary.txt" 2>/dev/null || true
      - name: Self-merge gate (PRs opened or updated by this run)
        # Planner runs open no PRs; without this guard they gated every PR other runs opened meanwhile
        # (same @me author), e.g. 42 min on 2026-10-18, blocking refill while the planner counts as active.
        if: always() && !startsWith(github.event.issue.title, '[planner]')
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          [ -x /opt/s5/siedler-sim-rs/recomp/target/release/s5verify ] || exit 0
          R=Kofi55533/siedler-sim-rs
          # Gate ONLY PRs this run produced: head branch created locally in this runner's clone or pushed from it
          # (reflog "update by push" of the tracking ref), head sha = that local tip, opened or committed after T0.
          # (Before 2026-10-20 every open agent/* PR of the shared account since T0 was gated -> 3-6 PRs per run.)
          cd /opt/s5/siedler-sim-rs
          git for-each-ref --format='%(refname:strip=2) %(objectname)' refs/heads/agent/ > "$RUNNER_TEMP/own.txt"
          for r in $(git for-each-ref --format='%(refname)' refs/remotes/origin/agent/); do
            git reflog show --format=%gs "$r" 2>/dev/null | grep -q 'update by push' && echo "${r#refs/remotes/origin/} $(git rev-parse "$r")" >> "$RUNNER_TEMP/own.txt"
          done
          cd - >/dev/null
          echo "branches produced by this run: $(cut -d' ' -f1 "$RUNNER_TEMP/own.txt" | sort -u | tr '\n' ' ')"
          sel=
          for x in $(gh pr list -R $R --state open --base clean/integration --limit 200 --json number,headRefName,headRefOid,createdAt \
                       -q '.[]|select(.headRefName|startswith("agent/"))|"\(.number)|\(.headRefName)|\(.headRefOid)|\(.createdAt)"'); do
            IFS='|' read -r m hb ho ca <<<"$x"
            grep -qx "$hb $ho" "$RUNNER_TEMP/own.txt" || continue
            if [[ ! "$ca" < "$T0" ]]; then sel="$sel $m"; continue; fi
            d=$(gh pr view "$m" -R $R --json commits -q '.commits[-1].committedDate' 2>/dev/null)
            [ -n "$d" ] && [[ ! "$d" < "$T0" ]] && sel="$sel $m"
          done
          echo "gating PRs:${sel:- none}"
          for n in $(printf '%s\n' $sel | sort -un); do
            S5_GATE_BUDGET_MIN=82 S5_LIVE_TIMEOUT=1800 timeout 85m $S5_SCRIPTS/s5-gate.sh "$n" >> "$W/gate.txt" 2>&1 || true
            sed -n 's/^### Muse self-merge gate: /gate #'"$n"': /p' "$W/gate.txt" | tail -n1 >> "$W/summary.txt"
          done
      - name: Post summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # gate verdict lines first (they were appended last and cut off by the 800-char limit)
          if [ -s "$W/summary.txt" ]; then S="$( { grep -E '^gate #' "$W/summary.txt"; grep -vE '^gate #' "$W/summary.txt"; } | head -c 800)"
          elif [ -s "$RUNNER_TEMP/opencode.log" ]; then S="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/opencode.log" | grep -v '^\s*$' | tail -n 3 | head -c 500)"
          else S='No summary produced.'; fi
          gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n[run](%s)' "$S" "$RUN")"
          # task issues are done when their run ends (Dominic 2026-10-20: 374 open planner-task issues looked like pending work
          # to the planner); planner issues stay open too briefly to matter and are closed the same way
          gh issue edit "$N" -R "$GITHUB_REPOSITORY" --remove-label launched --remove-label queued >/dev/null 2>&1 || true
          gh issue close "$N" -R "$GITHUB_REPOSITORY" --reason completed >/dev/null 2>&1 || true
