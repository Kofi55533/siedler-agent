name: refill
# Zero-LLM DeepSeek refill + launcher (ported from the box script deepseek-refill/refill.sh).
# Backlog queue (Dominic 2026-10-20): the planner only QUEUES task issues (labels planner-task + queued, the /opencode
# text in the body under ---PLANNER-COMMENT---, no comment). This workflow
#   1) closes queued tasks older than STALE_H hours (never launched -> likely stale; the planner re-plans),
#   2) launches queued tasks into free slots (DS-REQ first, then oldest): posts the /opencode comment (authored by
#      Kofi55533 via PRIVATE_REPO_TOKEN, which is what triggers opencode.yml), then swaps label queued -> launched.
#      A task that already has an /opencode comment is never commented again (no double start).
#      Launching does NOT wait for the planner.
#   3) opens a `[planner] refill ... N=<n>` issue only if no planner is active, none was created < 15 min ago,
#      a slot is free and the queued backlog < LOW_WATER; N = BACKLOG_TARGET - backlog (max 15).
# Slots: active = DISTINCT issue titles among non-completed opencode.yml runs (extra pending runs of the same issue,
# created by comments during a run and skipped later, are not counted). A running planner counts as 1 of the
# TARGET slots (it occupies a runner like any task).
# Sizing (measured 2026-10-19): mean task run 63 min (18 runs) -> at 20 slots ~11 runs finish per ~35 min planner
# cycle; BACKLOG_TARGET=14 covers one cycle with margin, LOW_WATER=8 starts the next planner while ~8 are still queued.
# No planner backoff any more (Dominic 2026-10-20): planners always fill N from the fill sources; only the 15-min spacing stays.
# Also re-dispatches coverage.yml when the published coverage map is older than 55 min (schedules do not fire here)
# and gate-baseline.yml (s5-gate baseline cache warm-up) whenever none is running.
# Only opencode.yml runs are counted, so this workflow's own runs never count as active.
# API budget (2026-10-20: the account's 5000 REST calls/h were exhausted 13:00-13:26): calls that only touch this public repo
# use the built-in GITHUB_TOKEN (separate limit); PRIVATE_REPO_TOKEN (PAT) only where it is required: the private
# siedler-sim-rs GraphQL query and issues/comments that must be authored by Kofi55533 to trigger opencode.yml (task launch
# comment, planner issue + comment, subsystem issue create). When either token is (nearly) out of calls the cycle ends cleanly
# (exit 0, nothing launched or decided) instead of failing or deciding on empty answers.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target number of active opencode runs'
        required: false
        default: '18'
      subsystem_slots:
        description: 'Subsystem runs kept active/queued (of the target slots; scripts/subsystems.json order)'
        required: false
        default: '2'
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: refill
  cancel-in-progress: false
jobs:
  refill:
    if: vars.FLEET_V2_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts, sparse-checkout-cone-mode: true }
      - name: Refill
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RL_MIN: '100'
          R: ${{ github.repository }}
          TARGET: ${{ github.event.inputs.target || '18' }}
          SUBSYSTEM_SLOTS: ${{ github.event.inputs.subsystem_slots || vars.SUBSYSTEM_SLOTS || '2' }}
          GH_TIMEOUT: '60'
          BACKLOG_TARGET: '14'
          LOW_WATER: '8'
          STALE_H: '6'
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          TZ: Europe/Berlin
        run: |
          set -u
          log(){ echo "$(date '+%F %T %Z') $*"; echo "- $*" >> "$GITHUB_STEP_SUMMARY"; }
          gh_(){ local i; for i in 1 2 3; do timeout -k 10 "$GH_TIMEOUT" gh "$@" && return 0; sleep $((i*3)); done; return 1; }
          isnum(){ [[ "${1:-}" =~ ^[0-9]+$ ]]; }
          isnum "$TARGET" || { log "bad TARGET='$TARGET'"; exit 1; }
          # API budget: rate_limit itself is free. rl_low = a token's REST (core) or GraphQL budget is below RL_MIN.
          rl(){ GH_TOKEN="$1" gh api rate_limit -q '"\(.resources.core.remaining) \(.resources.graphql.remaining) \(.resources.core.reset)"' 2>/dev/null; }
          RLMSG=""
          rl_low(){ local a b c d e f x; read -r a b c <<<"$(rl "$PAT")"; read -r d e f <<<"$(rl "$GH_TOKEN")"
            RLMSG="PAT core ${a:-?} graphql ${b:-?} (core reset $(date -d "@${c:-0}" +%H:%M)), GITHUB_TOKEN core ${d:-?} graphql ${e:-?}"
            for x in "$a" "$b" "$d" "$e"; do isnum "$x" && [ "$x" -lt "$RL_MIN" ] && return 0; done; return 1; }
          if rl_low; then log "API rate limit low ($RLMSG) -> cycle skipped cleanly (nothing launched, closed or decided)"; exit 0; fi
          log "API budget: $RLMSG"
          # 0) coverage map freshness (coverage.yml cron does not fire reliably)
          cu=$(gh_ release view coverage-cache -R "$R" --json assets -q '.assets[]|select(.name=="coverage-meta.txt")|.updatedAt' || true)
          if [ -z "$cu" ] || [[ "$cu" < "$(date -u -d '-55 min' +%FT%TZ)" ]]; then
            busy=$(gh_ run list -R "$R" -w coverage.yml --limit 5 --json status -q '[.[]|select(.status!="completed")]|length' || echo 1)
            [ "$busy" = 0 ] && gh_ workflow run coverage.yml -R "$R" --ref main && log "coverage map from ${cu:-never} -> dispatched coverage.yml"
          fi
          # gate-baseline runs: ONE run list (was 5 identical-list calls per cycle); on failure the old fail-safe defaults
          GB=$(gh_ run list -R "$R" -w gate-baseline.yml --limit 100 --json status,displayTitle,createdAt) || GB=""
          gbq(){ [ -n "$GB" ] && jq -r --arg t3 "$(date -u -d '-3 hours' +%FT%TZ)" --arg t90 "$(date -u -d '-90 min' +%FT%TZ)" "$1" <<<"$GB" 2>/dev/null; }
          # 0b) keep the s5-gate baseline cache warm for the current clean/integration code tree (pre-check exits in ~20 s on a hit)
          wb=$(gbq '[.[]|select(.status!="completed" and (.displayTitle|test("warm")))]|length'); isnum "$wb" || wb=1
          [ "$wb" = 0 ] && gh_ workflow run gate-baseline.yml -R "$R" --ref main -f mode=warm >/dev/null && log "gate-baseline warm-up dispatched"
          # 0d) genb/genc re-measure without an LLM (fix 3, 2026-10-20): every 3 h (replaces DeepSeek "re-measure" tasks)
          rm3=$(gbq '[.[]|select((.displayTitle|test("remeasure")) and .createdAt > $t3)]|length'); isnum "$rm3" || rm3=1
          [ "$rm3" = 0 ] && gh_ workflow run gate-baseline.yml -R "$R" --ref main -f mode=remeasure >/dev/null && log "genb/genc re-measure dispatched (CI, no LLM)"
          # 0c) re-gate PRs held by a lane claim (Dominic 2026-10-20: Codex and DeepSeek must not block each other). Nobody re-runs
          #     the gate of a held PR otherwise; gate-baseline mode=regate first checks the claim (cheap) and runs the normal gate
          #     (same criteria, merges on PASS) only if the claim no longer holds it. Max 2 per cycle, each PR at most every 90 min.
          #     Also PRs whose last gate was DEFERRED (a GitHub API rate limit stopped it before a verdict; s5-gate.sh exit 3).
          RG=$(gbq '[.[]|select(.createdAt > $t90)|.displayTitle]|join("|")'); [ -n "$GB" ] || RG=SKIP
          # at most 2 re-gate jobs run at once in total (11:24 2026-10-20: 6 concurrent re-gates + scoreboard pushed opencode to 13)
          RGA=$(gbq '[.[]|select(.status!="completed" and (.displayTitle|test("regate")))]|length')
          isnum "$RGA" || RGA=2
          if [ "$RG" != SKIP ]; then
            nrg=0
            for pr in $(GH_TOKEN="$PAT" gh_ api graphql -f query='{repository(owner:"Kofi55533",name:"siedler-sim-rs"){pullRequests(states:OPEN,first:100){nodes{number headRefName comments(last:15){nodes{body createdAt}}}}}}' \
                -q '.data.repository.pullRequests.nodes[]|select(.headRefName|startswith("agent/"))|select(([.comments.nodes[]|select(.body|test("self-merge gate"))]|last|.body // "")|test("fresh lane claim|self-merge gate: DEFERRED"))|.number' 2>/dev/null); do
              [ "$nrg" -ge 2 ] && break
              [ "$RGA" -ge 2 ] && { log "re-gate cap: $RGA regate jobs running -> no more dispatched"; break; }
              grep -qE "(^|\|)gate-baseline regate $pr(\||$)" <<<"$RG" && continue
              gh_ workflow run gate-baseline.yml -R "$R" --ref main -f mode=regate -f pr="$pr" >/dev/null && { nrg=$((nrg+1)); RGA=$((RGA+1)); log "re-gate dispatched for lane-held PR #$pr"; }
            done
          fi
          # 1) active slots = distinct issue titles of non-completed opencode runs
          J=$(gh_ run list -R "$R" -w opencode.yml --limit 100 --json status,displayTitle) || { rl_low && { log "run list failed under API rate limit ($RLMSG) -> cycle skipped"; exit 0; }; log "gh run list failed -> skip"; exit 1; }
          act=$(jq '[.[]|select(.status!="completed")|.displayTitle]|unique|length' <<<"$J")
          plan=$(jq '[.[]|select(.status!="completed" and (.displayTitle|startswith("[planner]")))|.displayTitle]|unique|length' <<<"$J")
          isnum "$act" && isnum "$plan" || { log "bad run list json -> skip"; exit 1; }
          # running gate-baseline jobs (regate/remeasure/warm/check) occupy runners too: count them in the slot math so the
          # account's job limit does not leave launched opencode runs queued (DeepSeek starved, 2026-10-20 11:24)
          GBA=$(gbq '[.[]|select(.status=="in_progress")]|length'); isnum "$GBA" || GBA=0
          [ "$GBA" -gt 0 ] && { log "gate-baseline jobs running: $GBA (counted as slots)"; act=$((act+GBA)); }
          # 1b) subsystem runs (Dominic 2026-10-20, whole game bit-exact): keep SUBSYSTEM_SLOTS (default 2 of the TARGET 18; scaling paused for the Codex strategy 2026-10-20 decision controller)
          #     'Subsystem:' tasks active or queued, in the order of scripts/subsystems.json (frontier blockers first, then the
          #     dependency order of the whole-game map), one run per subsystem continuing its branch until it is complete;
          #     they are launched first
          SUBSYS_TOKEN="$PAT" timeout -k 10 180 python3 scripts/subsystem_task.py ensure 2>&1 | while read -r l; do log "$l"; done
          # 2) queued backlog; close stale ones
          Q=$(gh_ issue list -R "$R" --label queued --state open --limit 100 --json number,title,createdAt) || { rl_low && { log "queued list failed under API rate limit ($RLMSG) -> cycle skipped"; exit 0; }; log "queued list failed -> skip"; exit 1; }
          stale=$(date -u -d "-${STALE_H} hours" +%FT%TZ)
          for n in $(jq -r --arg s "$stale" '.[]|select(.createdAt < $s)|.number' <<<"$Q"); do
            gh_ issue comment "$n" -R "$R" --body "Stale queued task (queued > ${STALE_H} h, never launched); closed by refill. The planner re-plans it if still relevant." >/dev/null
            gh_ issue edit "$n" -R "$R" --remove-label queued >/dev/null; gh_ issue close "$n" -R "$R" >/dev/null && log "closed stale queued #$n"
          done
          ORDER=$(jq -r --arg s "$stale" '[.[]|select(.createdAt >= $s)]|sort_by((if (.title|startswith("Subsystem:")) then 0 elif (.title|startswith("DS-REQ")) then 1 else 2 end), .createdAt)|.[].number' <<<"$Q")
          backlog=$(wc -w <<<"$ORDER")
          log "opencode active=$act (planner=$plan), queued=$backlog, target=$TARGET"
          # 3) launch into free slots (even while a planner runs)
          launched=""
          for n in $ORDER; do
            # keep one slot for the planner once this launch would take the backlog below low-water: otherwise the queue
            # drains while all TARGET slots are busy, step 4 finds "no free slot", and the planner starts only after the
            # queue is empty (11:35 -> 11:49 on 2026-10-20, active fell 18 -> 10)
            lim=$TARGET; [ "$plan" -eq 0 ] && [ "$backlog" -le "$LOW_WATER" ] && lim=$((TARGET-1))
            [ "$act" -ge "$lim" ] && break
            c=$(gh_ issue view "$n" -R "$R" --json comments -q '[.comments[]|select(.body|startswith("/opencode"))]|length') || continue
            if [ "$c" != 0 ]; then
              gh_ issue edit "$n" -R "$R" --remove-label queued --add-label launched >/dev/null; log "#$n already started -> label fixed"; backlog=$((backlog-1)); continue
            fi
            # task-supply guard (Dominic 2026-10-20, fix 3; scripts/known_done.py): no Port task whose addresses are all known
            # done, no Diverge task on a fixture IDENTICAL over its full length, no identical frontier target that already ended
            # evidence-only at the same turn, no genb/genc re-measure (gate-baseline mode=remeasure does that without an LLM)
            g=$(timeout -k 10 120 python3 scripts/known_done.py guard "$n" 2>/dev/null || echo "defer: guard error")
            # guard inputs unreadable: under an API rate limit stop launching (never let a task through unchecked); otherwise
            # the old rule (launch, "ok (guard error)")
            if [[ "$g" == defer:* ]]; then
              if rl_low; then log "#$n guard ${g} under API rate limit ($RLMSG) -> launches paused this cycle"; break; fi
              g="ok (guard error: ${g#defer: })"
            fi
            if [[ "$g" == skip:* ]]; then
              gh_ issue comment "$n" -R "$R" --body "Skipped by refill (task guard, not launched): ${g#skip: }. If the base changed relevantly, the planner re-queues it with a body line 'Known-done-override: <change>'." >/dev/null
              gh_ issue edit "$n" -R "$R" --remove-label queued >/dev/null; gh_ issue close "$n" -R "$R" --reason "not planned" >/dev/null
              log "#$n not launched: $g"; backlog=$((backlog-1)); continue
            fi
            gh_ issue view "$n" -R "$R" --json body -q .body | sed -n '/---PLANNER-COMMENT---/,$p' | tail -n +2 > c.txt
            grep -q '^/opencode' c.txt || { log "#$n queued without /opencode text -> skipped"; continue; }
            # the launch comment must be authored by Kofi55533 (opencode.yml trigger condition) -> PAT
            if GH_TOKEN="$PAT" timeout -k 10 "$GH_TIMEOUT" gh issue comment "$n" -R "$R" --body-file c.txt >/dev/null; then
              gh_ issue edit "$n" -R "$R" --remove-label queued --add-label launched >/dev/null
              act=$((act+1)); backlog=$((backlog-1)); launched="$launched #$n"
            else
              log "comment on #$n failed (not retried this round)"
            fi
          done
          [ -n "$launched" ] && log "launched$launched -> active=$act queued=$backlog"
          # 4) planner: only when idle, backlog low and a slot free
          if [ "$plan" -gt 0 ]; then log "planner running -> no new planner"; exit 0; fi
          if [ "$backlog" -ge "$LOW_WATER" ]; then log "backlog $backlog >= low-water $LOW_WATER -> no planner"; exit 0; fi
          if [ "$act" -ge "$TARGET" ]; then log "no free slot for a planner"; exit 0; fi
          since=$(date -u -d '-15 min' +%FT%TZ)
          recent=$(gh_ issue list -R "$R" --state all --limit 10 --json title,createdAt \
                     -q "[.[]|select((.title|startswith(\"[planner]\")) and .createdAt > \"$since\")]|length")
          isnum "$recent" || { log "recent-planner check failed -> skip"; exit 1; }
          if [ "$recent" -gt 0 ]; then log "planner issue <15min old -> skip"; exit 0; fi
          # (the '<2 tasks -> 20 min backoff' was removed 2026-10-20 10:30, Dominic: planners always fill N from the fill sources)
          N=$((BACKLOG_TARGET-backlog)); [ "$N" -gt 15 ] && N=15
          [ "$N" -lt 1 ] && { log "N=$N -> nothing"; exit 0; }
          url=$(GH_TOKEN="$PAT" gh_ issue create -R "$R" --title "[planner] refill $(date '+%F %H:%M') N=$N" \
                  --body "Planner run (GitHub Actions refill workflow, run $GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID). Details in the /opencode comment.")
          n=$(grep -oE '[0-9]+$' <<<"$url")
          [ -z "$n" ] && { log "issue create failed"; exit 1; }
          GH_TOKEN="$PAT" timeout -k 10 "$GH_TIMEOUT" gh issue comment "$n" -R "$R" --body "/opencode PLANNER RUN N=$N. Read /home/runner/work/siedler-agent/siedler-agent/prompts/planner.md and follow it exactly (it overrides the coding-run instructions: no code, no PR, only QUEUE N task issues with labels planner-task + queued and the /opencode text in the issue body; the refill workflow launches them). Start with \$W/planner_state.md." >/dev/null \
            && log "backlog=$backlog -> planner #$n started N=$N" || { log "comment on #$n failed"; exit 1; }
      - name: Decision controller (shadow, logs only)
        # STRATEGY_20261020 s5: scripts/decision.py scores units and logs what it WOULD launch next to the current planner.
        # Shadow mode: launches, closes and changes nothing in the queue; stores its decision on agents/control at most every
        # 15 min (fleet/decision/shadow-latest.*). Never fails the refill job.
        if: always()
        continue-on-error: true
        env:
          PAT: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TZ: Europe/Berlin
        run: |
          core=$(GH_TOKEN="$PAT" gh api rate_limit -q .resources.core.remaining 2>/dev/null || echo 0)
          if [ "${core:-0}" -lt 400 ] 2>/dev/null; then echo "PAT core budget ${core} < 400 -> shadow decision skipped"; exit 0; fi
          GH_TOKEN="$PAT" timeout -k 10 150 python3 scripts/decision.py shadow --write --min-interval 15 \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "decision shadow failed (ignored)"

  rearm:
    # GitHub's cron schedule for this workflow did not fire at all (19:30-20:33 Berlin, 17.10.2026; still not on 19.10.),
    # so each run re-dispatches itself ~5 min later. Extra runs collapse via the `refill` concurrency group
    # (only one pending run is kept), so parallel chains cannot multiply.
    needs: refill
    if: always() && vars.FLEET_V2_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Re-dispatch refill in ~5 min
        env:
          GH_TOKEN: ${{ github.token }}  # workflow_dispatch by GITHUB_TOKEN does start a run (actions: write)
          R: ${{ github.repository }}
        run: |
          sleep 270
          gh workflow run refill.yml -R "$R" --ref main
