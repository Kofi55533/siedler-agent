name: refill
# Compatibility entry for old rearm jobs. fleet-control owns replenishment.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Legacy input; shared configuration is authoritative'
        default: '20'
permissions:
  contents: read
concurrency:
  group: fleet-controller
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refresh shared fleet
        run: python3 scripts/fleet.py control
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
