name: remeasure-live
# Scheduled live re-measure of every scoreboard scenario on the current clean/integration head (no LLM): each line of
# scripts/remeasure-shards.txt is one job, measured with s5-remeasure.sh (s5-live.sh per fixture). The job logs name only
# fixtures and turn numbers. The verdict lines ("<fixture>: DIVERGENT turn N" / "<fixture>: IDENTICAL N") go to the private
# siedler-data release remeasure-live (asset verdicts.txt, first line "sha <sha> time <UTC>"); scripts/scoreboard/build.py
# reads them as the newest clean/integration measurement. Divergence details per fixture go to the private release xc-hand
# (live-<fixture>.txt), never to a log. Replaces the stopped gate-baseline remeasure board path (refill is off since 2026-10-23).
on:
  schedule:
    - cron: '47 3,9,15,21 * * *'   # between the xc-census runs (:23 every 6 h), so both fit the 20-job limit
  workflow_dispatch:
  push: { branches: ['claude/live-remeasure'] }   # TEMP dry run, removed before merge
permissions: { contents: read }
concurrency: { group: remeasure-live, cancel-in-progress: false }
jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      sha: '${{ steps.p.outputs.sha }}'
      list: '${{ steps.p.outputs.list }}'
    steps:
      - uses: actions/checkout@v4
      - id: p
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          sha=$(gh api repos/Kofi55533/siedler-sim-rs/commits/clean/integration --jq .sha) || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "clean/integration @${sha:0:10}"
          echo "list=$(grep -v '^#' scripts/remeasure-shards.txt | grep . | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  remeasure:
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: { fx: '${{ fromJSON(needs.pin.outputs.list) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: scripts/s5-setup.sh clean/integration 1
      - name: Re-measure (no LLM)
        # every shard measures the pinned commit (a merge during the run must not mix two heads into one verdict file)
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}', FX: '${{ matrix.fx }}', S5_REMEASURE_BOARD: '0', S5_REMEASURE_SHA: '${{ needs.pin.outputs.sha }}' }
        run: |
          mkdir -p /tmp/v; S5_LIVE_TIMEOUT=3600 timeout 130m scripts/s5-remeasure.sh $FX | tee /tmp/v/out.txt
          grep -E '^[a-z0-9][a-z0-9-]*: (DIVERGENT turn|IDENTICAL) [0-9]+$' /tmp/v/out.txt > /tmp/v/verdicts.txt || true
          echo "verdicts: $(wc -l < /tmp/v/verdicts.txt)"
      - name: Upload divergence details (private release, nothing printed)
        if: always()
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}', FX: '${{ matrix.fx }}' }
        run: |
          source scripts/s5-env.sh; mkdir -p /tmp/up; n=0
          for x in $FX; do
            l=$S5/live/$x.log; o=/tmp/up/live-$x.txt
            { echo "fixture $x on clean/integration @$(git -C $S5_REPO rev-parse --short=10 HEAD)"
              if [ -f "$l" ]; then grep -m2 "clean image import\|^Error\|panicked" "$l"
                grep -m1 -A42 -E ": (DIVERGENT|IDENTICAL)" "$l" || tail -n 20 "$l"
              else echo "no live log (not installable?)"; grep -m3 "^$x:" $S5/remeasure/install.txt; fi
            } > "$o" 2>/dev/null || true; n=$((n+1))
          done
          gh release upload xc-hand -R Kofi55533/siedler-data --clobber /tmp/up/live-*.txt > /dev/null 2>&1 && echo "uploaded $n" || echo "upload failed ($n files)"
      - name: Verdicts artifact
        if: always()
        run: mkdir -p /tmp/v && touch /tmp/v/verdicts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'verdicts-${{ strategy.job-index }}', path: /tmp/v/verdicts.txt, retention-days: 3 }
  publish:
    needs: [pin, remeasure]
    if: always() && needs.pin.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'verdicts-*', path: /tmp/a }
      - name: Publish verdicts (private release remeasure-live)
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}', SHA: '${{ needs.pin.outputs.sha }}' }
        run: |
          f=/tmp/verdicts.txt; echo "sha $SHA time $(date -u +%Y-%m-%dT%H:%M:%SZ)" > $f
          cat /tmp/a/*/verdicts.txt 2>/dev/null | sort -u >> $f
          n=$(($(wc -l < $f) - 1)); echo "verdicts: $n"
          [ "$n" -gt 0 ] || { echo "nothing measured; release left unchanged"; exit 1; }
          R=Kofi55533/siedler-data
          gh release view remeasure-live -R $R > /dev/null 2>&1 ||
            gh release create remeasure-live -R $R --title remeasure-live --notes "scheduled live re-measure verdicts (siedler-agent remeasure-live.yml)" > /dev/null
          gh release upload remeasure-live -R $R --clobber $f > /dev/null && echo published
