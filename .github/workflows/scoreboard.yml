name: scoreboard
# Builds the public status page (GitHub Pages, branch gh-pages) every 15 min: how many scenarios and maps the clean
# engine plays turn-identical with the original, from the measurement releases (rm-*/measure-*.txt) in the private
# repo Kofi55533/siedler-data. Publishes only status words, turn numbers, level names and commit titles (data.json),
# never game state. Parsed measurement files are cached in gh-pages messungen.json, so a build downloads only new files
# (~5 REST calls when nothing changed). A failed build writes SKIP_PUBLISH and the last good page stays.
# Cadence: the cron below, every push of a scoreboard change to main, every completed full-measure run, plus fleet-control.yml, which dispatches this file when no run was created in the last 14 min.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    # a merged page or builder change goes live at once
    branches: [main]
    paths: ['scripts/scoreboard/**', '.github/workflows/scoreboard.yml']
  workflow_run:
    # fresh numbers right after each automatic full measurement (full-measure.yml)
    workflows: [full-measure]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  build:
    concurrency:
      group: scoreboard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /scripts/scoreboard/
          sparse-checkout-cone-mode: false
      - name: Fetch previous page (gh-pages)
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/prev"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            for f in messungen.json verlauf.json; do git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/prev/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/prev/$f"; done
          fi
      - name: Build data.json
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OUT: ${{ runner.temp }}/out
          PREV_DIR: ${{ runner.temp }}/prev
        run: python3 scripts/scoreboard/build.py
      - name: Publish to gh-pages
        env:
          OUT: ${{ runner.temp }}/out
        run: |
          if [ -f "$OUT/SKIP_PUBLISH" ]; then
            echo "Not published (last good page kept): $(cat "$OUT/SKIP_PUBLISH")" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ -s "$OUT/data.json" ] || { echo "no data.json -> not published" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          cp scripts/scoreboard/index.html "$OUT/index.html"
          touch "$OUT/.nojekyll"
          cd "$OUT"
          git init -q -b gh-pages
          git config user.name "siedler-scoreboard"
          git config user.email "Kofi55533@users.noreply.github.com"
          git add -A
          git commit -q -m "scoreboard $(TZ=Europe/Berlin date '+%F %H:%M %Z')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published $(TZ=Europe/Berlin date '+%F %H:%M %Z')" >> "$GITHUB_STEP_SUMMARY"
