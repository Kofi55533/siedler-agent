name: scoreboard
# Builds the public status page (GitHub Pages, branch gh-pages) every 15 min.
# Reads the private repo via PRIVATE_REPO_TOKEN; publishes only numbers/titles (data.json) + static index.html.
# Independent of opencode.yml / refill.yml (own concurrency group, no issues/comments).
# API budget (2026-10-20: one build cost ~990 REST calls of the shared PAT, 4-6 builds/h, the PAT hit 5000/h 12:48-13:26 and
# the 13:04/13:18 pages were published empty): ETag cache across runs (a 304 does not count; blobs/commits by sha are
# immutable), AES-encrypted with a key derived from the PAT (it holds private-repo data; fork PRs get no secrets); public-repo
# calls use the built-in GITHUB_TOKEN; a rate-limited/partial build writes SKIP_PUBLISH and the last good page stays.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    # concurrency only on the build job, so a sleeping rearm job never blocks a manual/new build
    concurrency:
      group: scoreboard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/scoreboard }
      - name: Fetch previous history (gh-pages)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git show FETCH_HEAD:history.json > "$RUNNER_TEMP/prev.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/prev.json"
          else
            echo '[]' > "$RUNNER_TEMP/prev.json"
          fi
      - name: Restore API cache (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apicache.enc
          key: sbapi-${{ github.run_id }}
          restore-keys: sbapi-
      - name: Build data.json
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN_PUB: ${{ github.token }}
          OUT: ${{ runner.temp }}/out
          PREV: ${{ runner.temp }}/prev.json
          API_CACHE: ${{ runner.temp }}/apicache
          ENC: ${{ runner.temp }}/apicache.enc
          FLEET_V2_ENABLED: ${{ vars.FLEET_V2_ENABLED }}  # repo variables (not secrets): slot limits for the Fleet v2 view
          FLEET_V2_WORKER_LIMIT: ${{ vars.FLEET_V2_WORKER_LIMIT }}
        run: |
          K=$(printf 'siedler-scoreboard-cache:%s' "$GH_TOKEN" | sha256sum | cut -c1-64); export K
          mkdir -p "$API_CACHE"
          if [ -s "$ENC" ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in "$ENC" | gzip -dc > "$API_CACHE/etags.json" 2>/dev/null || rm -f "$API_CACHE/etags.json"; fi
          echo "api cache in: $(du -h "$API_CACHE/etags.json" 2>/dev/null | cut -f1)"
          python3 scripts/scoreboard/build.py
          rm -f "$ENC"; [ -s "$API_CACHE/etags.json" ] && gzip -c "$API_CACHE/etags.json" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:K -out "$ENC"
          rm -rf "$API_CACHE"; echo "api cache out: $(du -h "$ENC" 2>/dev/null | cut -f1)"
      - name: Save API cache (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apicache.enc
          key: sbapi-${{ github.run_id }}
      - name: Publish to gh-pages
        env:
          OUT: ${{ runner.temp }}/out
        run: |
          if [ -f "$OUT/SKIP_PUBLISH" ]; then
            echo "Not published (last good page kept): $(cat "$OUT/SKIP_PUBLISH")" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ -s "$OUT/data.json" ] || { echo "no data.json -> not published" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          cp scripts/scoreboard/index.html "$OUT/index.html"
          touch "$OUT/.nojekyll"
          cd "$OUT"
          git init -q -b gh-pages
          git config user.name "siedler-scoreboard"
          git config user.email "Kofi55533@users.noreply.github.com"
          git add -A
          git commit -q -m "scoreboard $(TZ=Europe/Berlin date '+%F %H:%M %Z')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published $(TZ=Europe/Berlin date '+%F %H:%M %Z')" >> "$GITHUB_STEP_SUMMARY"
  rearm:
    # GitHub's cron schedule did not fire for this repo (17.10.2026), so each run re-dispatches itself
    # ~13 min later. Only the newest run re-dispatches, so parallel chains collapse into one.
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Re-dispatch scoreboard in ~13 min
        env:
          GH_TOKEN: ${{ github.token }}  # same public repo; workflow_dispatch by GITHUB_TOKEN starts a run (actions: write)
          R: ${{ github.repository }}
        run: |
          sleep 780
          newer=$(gh run list -R "$R" -w scoreboard.yml --limit 20 --json databaseId -q "[.[]|select(.databaseId > ${{ github.run_id }})]|length" || echo 0)
          if [ "${newer:-0}" -gt 0 ]; then echo "newer run exists -> no re-dispatch"; exit 0; fi
          gh workflow run scoreboard.yml -R "$R" --ref main
