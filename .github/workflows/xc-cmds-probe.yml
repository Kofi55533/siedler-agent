name: xc-cmds-probe
# one-off probe (counts only): class-A functions the capture-functions point reaches per image, autonomous vs with the
# generated fixtures' commands (scripts/xc/lib.sh xc_cmds)
on:
  push:
    branches: [claude/xc-cmds-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GIT_LFS_SKIP_SMUDGE: '1' }
        run: scripts/s5-setup.sh clean/integration 1
      - name: Probe (counts only)
        run: |
          set +e
          source scripts/xc/lib.sh
          xc_build || exit 2
          cat "$XC/cmds/summary.txt"
          awk '{sub(":","",$1); print $1}' "$XC/cmds/summary.txt" | awk -v i=${{ matrix.shard }} '(NR-1)%2==i' > names.txt
          xc_scenarios | awk 'NR==FNR{n[$1];next} $1 in n' names.txt - > lines.txt
          one(){ # one <name> <img> <tag> [env]
            local t=$(date +%s)
            ( cd "$S5_REPO" && env S5_XCHECK_IMAGE="$2" S5_CAPTURE_SKIP=0 S5_CAPTURE_TURNS=$XC_TURNS S5_CAPTURE_MAX=$XC_MAX \
                S5_CAPTURE_STRIDE=$XC_STRIDE S5_CAPTURE_JSON="$XC/p-$1-$3.json" S5_CAPTURE_FUNCTIONS="$XC/inventory.txt" "${@:4}" \
                timeout -k 30 "$XC_TIMEOUT" "$(xc_bin capture-functions)" --nocapture --test-threads=1 ) < /dev/null > "$XC/p-$1-$3.log" 2>&1
            echo "$1 $3: exit $? secs=$(( $(date +%s) - t ))"
          }
          while read -r name img _; do
            one "$name" "$img" auto &
            one "$name" "$img" cmds S5_XCHECK_COMMANDS="$XC/cmds/$name.bin" &
            while [ "$(jobs -rp | wc -l)" -ge 4 ]; do wait -n; done
          done < lines.txt; wait
          python3 - "$XC" lines.txt <<'P'
          import json, sys
          from pathlib import Path
          xc = Path(sys.argv[1])
          def fns(n, t):
              p = xc / f"p-{n}-{t}.json"
              if not (p.is_file() and p.stat().st_size): return None
              d = json.loads(p.read_text())
              return {k for k, g in d["groups"].items() if k.startswith("FN_") and g["entries"]}, d
          for line in open(sys.argv[2]):
              n = line.split()[0]; a, c = fns(n, "auto"), fns(n, "cmds")
              if not a or not c: print(n, "auto", "ok" if a else "none", "cmds", "ok" if c else "none"); continue
              print(f"{n}: executed auto {len(a[0])} cmds {len(c[0])} only-cmds {len(c[0]-a[0])} only-auto {len(a[0]-c[0])}; "
                    f"differ auto {sum(g['failing'] for g in a[1]['groups'].values())} cmds {sum(g['failing'] for g in c[1]['groups'].values())}")
          P
