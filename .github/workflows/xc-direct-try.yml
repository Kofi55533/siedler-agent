name: xc-direct-try
# TEMP trial of the direct-call check (scripts/xc/direct.sh) on a sim-rs ref; removed before merging. Counts only.
on:
  push:
    branches: ['claude/direct-try']
permissions: { contents: read }
concurrency: { group: xc-direct-try, cancel-in-progress: true }
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: [bc, combat, economy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GIT_LFS_SKIP_SMUDGE: '1' }
        run: scripts/s5-setup.sh claude/direct-calls 1
      - name: Direct
        # replay and the live method list only (no binding called): the base time of one pilot check
        run: S5_CAPTURE_ONLY=FN_0 scripts/xc/direct.sh ${{ matrix.scenario }}
      - name: Upload (private)
        if: always()
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          source scripts/s5-env.sh; source scripts/xc/lib.sh; n=0
          for f in direct live; do
            [ -s "$XC/$f.json" ] || continue
            gzip -9c "$XC/$f.json" > "$RUNNER_TEMP/$f-${{ matrix.scenario }}.json.gz"; n=$((n + 1))
          done
          [ $n -gt 0 ] || { echo "nothing to upload"; exit 0; }
          gh release view direct-check -R Kofi55533/siedler-data > /dev/null 2>&1 || gh release create direct-check -R Kofi55533/siedler-data -t direct-check -n "direct-call check results" > /dev/null
          gh release upload direct-check -R Kofi55533/siedler-data --clobber "$RUNNER_TEMP"/*-${{ matrix.scenario }}.json.gz > /dev/null && echo "uploaded $n files"
