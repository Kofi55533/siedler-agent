name: xc-hand
# Hand-written port path (Codex / Opus): verify a siedler-sim-rs branch on the runners with
# scripts/xc/verify.sh and on VERDICT PASS squash-merge it into clean/integration. The author
# of the port never runs `gh pr merge`; this workflow owns the merge (same method as worker.sh).
# Additive: does not change xc-worker / xc-census / xc-watchdog / xc-try / fleet-* behaviour.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'siedler-sim-rs branch to verify (e.g. xc/fn-57d214)'
        required: true
        type: string
      kinds:
        description: 'comma-separated kinds (e.g. FN_57D214,FN_57D10D)'
        required: true
        type: string
      pr:
        description: 'optional existing PR number into clean/integration'
        required: false
        default: ''
        type: string
  # the same from an issue labeled xc-hand by the owner, titled `[xc-hand <ref> <kinds> [pr]]` (optional `[xc-direct [scenarios]]`, `[xc-drive FN_...]`, `[xc-max N]`, `[xc-args w,...]`, `[xc-free]`; for sessions whose
  # token cannot dispatch workflows); the verdict goes to the issue as a comment, then it is closed
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
  pull-requests: write
env:
  XC_PROJECT: ${{ vars.XC_PROJECT || 'Kofi55533/siedler-sim-rs' }}
  XC_DATA: ${{ vars.XC_DATA || 'Kofi55533/siedler-data' }}
  XC_AGENT: ${{ vars.XC_AGENT || 'Kofi55533/siedler-agent' }}
jobs:
  hand:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.label.name == 'xc-hand'
      && github.event.sender.login == 'Kofi55533' && contains(github.event.issue.title, '[xc-hand '))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Job start
        run: echo "XC_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Arguments
        id: a
        env: { TITLE: '${{ github.event.issue.title }}', IREF: '${{ inputs.ref }}', IKINDS: '${{ inputs.kinds }}', IPR: '${{ inputs.pr }}' }
        # an issue title is anyone's text: only a plain ref name, FN_/TICK_ kinds and a PR number pass
        run: |
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            read -r IREF IKINDS IPR < <(grep -o '\[xc-hand [^]]*\]' <<< "$TITLE" | head -1 | sed 's/^\[xc-hand //; s/\]$//')
            # [xc-direct] or [xc-direct <scenario>,...]: the direct-call check instead of the census runs
            if grep -q '\[xc-direct' <<< "$TITLE"; then
              IDIRECT=$(grep -o '\[xc-direct[^]]*\]' <<< "$TITLE" | head -1 | sed 's/^\[xc-direct *//; s/\]$//')
              [[ "$IDIRECT" =~ ^[a-z0-9_,-]*$ ]] || { echo "not a scenario list"; exit 1; }
              echo "direct=${IDIRECT:-bc,combat,economy}" >> "$GITHUB_OUTPUT"
            fi
            # [xc-drive FN_<method>,...]: the kind is not virtual, so drive mode calls these methods reaching it
            IDRIVE=$(grep -o '\[xc-drive [^]]*\]' <<< "$TITLE" | head -1 | sed 's/^\[xc-drive //; s/\]$//')
            if [ -n "$IDRIVE" ]; then
              [[ "$IDRIVE" =~ ^FN_[A-F0-9]+(,FN_[A-F0-9]+)*$ ]] || { echo "not a method list"; exit 1; }
              echo "drive=$IDRIVE" >> "$GITHUB_OUTPUT"
            fi
            # direct-call knobs: [xc-max N] objects per method (drive: samples), [xc-args <hex>,...] stack words,
            # [xc-free] calls kinds no live object holds on a zeroed scratch object
            IMAX=$(grep -o '\[xc-max [^]]*\]' <<< "$TITLE" | head -1 | sed 's/^\[xc-max //; s/\]$//')
            if [ -n "$IMAX" ]; then [[ "$IMAX" =~ ^[0-9]{1,3}$ ]] || { echo "not a count"; exit 1; }; echo "dmax=$IMAX" >> "$GITHUB_OUTPUT"; fi
            IARGS=$(grep -o '\[xc-args [^]]*\]' <<< "$TITLE" | head -1 | sed 's/^\[xc-args //; s/\]$//')
            if [ -n "$IARGS" ]; then
              [[ "$IARGS" =~ ^(0x)?[0-9a-fA-F]{1,8}(,(0x)?[0-9a-fA-F]{1,8}){0,7}$ ]] || { echo "not a word list"; exit 1; }
              echo "dargs=$IARGS" >> "$GITHUB_OUTPUT"
            fi
            if grep -q '\[xc-free\]' <<< "$TITLE"; then echo "dfree=1" >> "$GITHUB_OUTPUT"; fi
          fi
          [[ "$IREF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "not a ref name"; exit 1; }
          [[ "$IKINDS" =~ ^[A-Z0-9_]+(,[A-Z0-9_]+)*$ ]] || { echo "not a kind list"; exit 1; }
          [[ "${IPR:-}" =~ ^[0-9]*$ ]] || { echo "not a PR number"; exit 1; }
          { echo "ref=$IREF"; echo "kinds=$IKINDS"; echo "pr=${IPR:-}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: '${{ env.XC_AGENT }}', ref: "${{ github.repository == 'Kofi55533/siedler-agent' && github.sha || 'main' }}" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup game data, toolchain, build cache (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GIT_LFS_SKIP_SMUDGE: '1' }
        run: |
          scripts/s5-setup.sh clean/integration 1
          echo "W=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          # no credential stays in a checkout scripts push with GH_TOKEN explicitly
          git -C /opt/s5/siedler-sim-rs remote set-url origin "https://github.com/$XC_PROJECT.git"
          mkdir -p /opt/s5/xc && GH_TOKEN=$T gh release download xc-worklist -R $XC_DATA -D /opt/s5/xc -p worklist.json --clobber
      - name: Verify and merge ${{ steps.a.outputs.kinds }} from ${{ steps.a.outputs.ref }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          XC_CLAIM_TOKEN: ${{ github.run_id }}/hand-${{ steps.a.outputs.ref }}
          REF: ${{ steps.a.outputs.ref }}
          KINDS: ${{ steps.a.outputs.kinds }}
          PR: ${{ steps.a.outputs.pr }}
          DIRECT: ${{ steps.a.outputs.direct }}
          DRIVE: ${{ steps.a.outputs.drive }}
          DMAX: ${{ steps.a.outputs.dmax }}
          DARGS: ${{ steps.a.outputs.dargs }}
          DFREE: ${{ steps.a.outputs.dfree }}
        run: |
          if [ -n "$DIRECT" ]; then export XC_MODE=direct XC_DIRECT_SCENARIOS="${DIRECT//,/ }"; fi
          if [ -n "$DIRECT" ] && [ -n "$DRIVE" ]; then export S5_DRIVE_METHODS=$DRIVE; fi
          if [ -n "$DIRECT" ] && [ -n "$DMAX" ]; then export S5_DIRECT_MAX=$DMAX S5_DRIVE_SAMPLES=$DMAX; fi
          if [ -n "$DIRECT" ] && [ -n "$DARGS" ]; then export S5_DIRECT_ARGS=$DARGS; fi
          if [ -n "$DIRECT" ] && [ -n "$DFREE" ]; then export S5_DIRECT_FREE=1; fi
          # 0 merged / already identical, 1 verify FAIL (commented), 2 infrastructure
          rc=0
          if [ -n "$PR" ]; then scripts/xc/hand.sh "$REF" "$KINDS" "$PR" || rc=$?
          else scripts/xc/hand.sh "$REF" "$KINDS" || rc=$?; fi
          echo "hand exit=$rc after $(( ($(date +%s) - XC_T0) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"
          [ $rc = 2 ] && exit 1
          [ $rc = 1 ] && exit 1
          exit 0
      - name: Verdict to the issue
        if: always() && github.event_name == 'issues'
        env: { GH_TOKEN: '${{ github.token }}', N: '${{ github.event.issue.number }}' }
        run: |
          gh api repos/$GITHUB_REPOSITORY/issues/$N/comments -f body="xc-hand ${{ job.status }}: $(tail -n 1 $GITHUB_STEP_SUMMARY 2>/dev/null) (counts in the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" > /dev/null
          gh api -X PATCH repos/$GITHUB_REPOSITORY/issues/$N -f state=closed -f state_reason=completed > /dev/null
