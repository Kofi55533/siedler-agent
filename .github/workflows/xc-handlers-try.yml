          source scripts/xc/lib.sh
          scripts/xc/stopped.sh 2>/dev/null && exit 0
          xc_build || exit 2
          xc_scenarios | python3 scripts/xc/xc.py shard ${{ matrix.shard }} 4 > "$XC/shard.txt"
          echo "scenarios: $(wc -l < "$XC/shard.txt")"
          xc_runs "$XC/hd" "$ONLY" < "$XC/shard.txt" || echo "runs rc $?"
          python3 - "$XC/hd" "$XC/handlers.json" <<'P'
          import json, sys, glob, collections
          out = collections.defaultdict(lambda: {"samples": 0, "failing": 0, "entries": 0, "scenarios": 0})
          n = 0
          for f in glob.glob(sys.argv[1] + "/*.json"):
              d = json.load(open(f)); n += 1
              for k, g in d["groups"].items():
                  o = out[k]; o["samples"] += g["samples"]; o["failing"] += g["failing"]; o["entries"] += g.get("entries", 0); o["scenarios"] += 1
              ex = {k: g.get("examples", [])[:2] for k, g in d["groups"].items() if g["failing"]}
              for k, e in ex.items(): out[k].setdefault("examples", e)
          json.dump(out, open(sys.argv[2], "w"))
          print(f"{n} scenario results, {len(out)} kinds called, {sum(1 for o in out.values() if o['samples'] and not o['failing'])} identical, {sum(1 for o in out.values() if o['failing'])} differ")
          P
      - name: Upload (private)
