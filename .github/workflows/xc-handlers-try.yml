          s=${{ matrix.shard }}; R=Kofi55533/siedler-data
          [ -s "$XC/handlers.json" ] || { echo "no json"; exit 0; }
          gzip -c "$XC/handlers.json" > handlers-$s.json.gz
          gh release upload direct-check -R $R --clobber handlers-$s.json.gz > /dev/null && echo uploaded
