name: xc-handlers-try
# TEMP census check of the handler functor constructor bindings of a sim-rs ref (they run at entity creation, which
# the recordings hold); removed before merging. Counts only in the log; per-function groups go to the private
# release direct-check of the data repo.
on:
  push:
    branches: ['claude/handlers-try']
permissions: { contents: read }
concurrency: { group: xc-handlers-try, cancel-in-progress: true }
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
