name: xc-imperr-probe
# one-off probe: the function point with the player commands; the documents (import errors) go to the private release
on:
  push:
    branches: [claude/xc-imperr-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GIT_LFS_SKIP_SMUDGE: '1' }
        run: scripts/s5-setup.sh clean/integration 1
      - name: Function point with commands (counts only)
        run: |
          set +e
          source scripts/xc/lib.sh
          xc_build || { echo build failed; exit 2; }
          xc_scenarios | awk '$1=="ai-long"||$1=="camp-crawford"||$1=="combat"||$1=="economy"||$1=="late-ai"||$1=="map-winterisland"||$1=="wsecon"' \
            | awk -v i=${{ matrix.shard }} '(NR - 1) % 2 == i' > lines.txt
          mkdir -p $RUNNER_TEMP/imperr
          while read -r name img skip turns; do
            ( cd "$S5_REPO" && env S5_XCHECK_IMAGE="$img" S5_CAPTURE_SKIP=$skip S5_CAPTURE_TURNS=$turns S5_CAPTURE_MAX=$XC_MAX \
                S5_CAPTURE_STRIDE=$XC_STRIDE S5_CAPTURE_JSON="$RUNNER_TEMP/imperr/$name.json" S5_CAPTURE_FUNCTIONS="$XC/inventory.txt" \
                S5_XCHECK_COMMANDS="$XC/cmds/$name.bin" timeout -k 30 "$XC_TIMEOUT" "$(xc_bin capture-functions)" --nocapture --test-threads=1 ) \
                < /dev/null > /dev/null 2>&1 &
          done < lines.txt; wait
          ls $RUNNER_TEMP/imperr | wc -l
      - name: Upload to the private release (game state never leaves private storage)
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          source scripts/s5-env.sh
          cd $RUNNER_TEMP && tar -cf - imperr | zstd -q -19 > imperr-${{ matrix.shard }}.tzst
          gh release view xc-probe -R $XC_DATA > /dev/null 2>&1 || gh release create xc-probe -R $XC_DATA -t xc-probe -n "probe documents (transient)" > /dev/null 2>&1 || true
          gh release upload xc-probe -R $XC_DATA --clobber imperr-${{ matrix.shard }}.tzst > /dev/null
          echo "uploaded $(stat -c %s imperr-*.tzst) bytes"
