name: xc-pattern-try
# TEMP direct-call check of the pattern-translated bindings of a sim-rs ref; removed before merging. Counts only in the
# log; the per-function groups go to the private release direct-check of the data repo.
on:
  push:
    branches: ['claude/pattern-try']
permissions: { contents: read }
concurrency: { group: xc-pattern-try, cancel-in-progress: true }
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: [bc, combat, economy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GIT_LFS_SKIP_SMUDGE: '1' }
        run: scripts/s5-setup.sh claude/pattern 1
      - name: Direct
        env:
          S5_CAPTURE_ONLY: 'FN_40D73E,FN_4A35D3,FN_4A4C9A,FN_4A9AF6,FN_4ACD15,FN_4AFB32,FN_4AFB65,FN_4B1480,FN_4B1A5D,FN_4B4DF1,FN_4B6CF3,FN_4B82BF,FN_4B8961,FN_4BE730,FN_4BE799,FN_4C08A6,FN_4C08E2,FN_4C1ADD,FN_4C339F,FN_4C55DC,FN_4C8C98,FN_4C9AED,FN_4CA649,FN_4CB980,FN_4CBA94,FN_4CC4BF,FN_4CC4C7,FN_4CC4CF,FN_4D2E5C,FN_4D3F15,FN_4D41F8,FN_4D4229,FN_4D4BE8,FN_4D5446,FN_4D680E,FN_4D6B4A,FN_4D716C,FN_4D8992,FN_4DA695,FN_4DAF6B,FN_4DAF97,FN_4DB2C3,FN_4DBA34,FN_4DBBFA,FN_4DCA25,FN_4DCCAE,FN_4DD4AF,FN_4DF19E,FN_4E01DC,FN_4E0D6A,FN_4E1938,FN_4E1C91,FN_4E2B66,FN_4E2E5C,FN_4E331C,FN_4E3F4E,FN_4E5F0D,FN_4E655B,FN_4E6690,FN_4E8B61,FN_4EA57F,FN_4EAC27,FN_4EB2B9,FN_4F0972,FN_4F1F43,FN_4F23F7,FN_4F245F,FN_4F2A94,FN_4F3311,FN_4F3C37,FN_4F4D44,FN_4F602B,FN_4F623E,FN_4F67A4,FN_4F69EA,FN_4F6B28,FN_4F7856,FN_4F9769,FN_4F9792,FN_4F9CA1,FN_4FA76B,FN_4FAC1E,FN_4FAC51,FN_4FBEA8,FN_4FC650,FN_4FE11A,FN_4FE943,FN_4FF2B5,FN_4FFF05,FN_500C55,FN_50124D,FN_504221,FN_505A93,FN_506C5A,FN_5082BA,FN_509D89,FN_50A090,FN_50DDB9,FN_50E6E9,FN_50FA18,FN_50FA77,FN_511296,FN_5118D1,FN_5124DA,FN_512CF2,FN_513253,FN_515C5A,FN_5174E0,FN_570EF8,FN_570F27,FN_570F73,FN_575F3F,FN_57D371,FN_5809AE,FN_5809D3,FN_5809E4,FN_5809EC,FN_5809F4,FN_5809FC,FN_580A04,FN_580A2E,FN_580A36,FN_58348B,FN_583710,FN_58505E,FN_58606B,FN_588551,FN_589027,FN_58D022,FN_58D645,FN_5B8A17,FN_5BB409,FN_5BC109'
        run: scripts/xc/direct.sh ${{ matrix.scenario }}
      - name: Upload (private)
        if: always()
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          source scripts/xc/lib.sh
          s=${{ matrix.scenario }}; R=Kofi55533/siedler-data
          [ -s "$XC/direct.json" ] || { echo "no json"; exit 0; }
          gzip -c "$XC/direct.json" > pattern-$s.json.gz
          gh release view direct-check -R $R > /dev/null 2>&1 || gh release create direct-check -R $R -t direct-check -n "direct-call check results" > /dev/null 2>&1 || true
          gh release upload direct-check -R $R --clobber pattern-$s.json.gz > /dev/null && echo uploaded
