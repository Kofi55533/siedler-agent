name: xc-statics-try
# TEMP direct-call check of the pattern-family bindings (statics, constructors, creators, destructors, pure) of a sim-rs ref; removed before merging. Counts only in the
# log; the per-function groups go to the private release direct-check of the data repo.
on:
  push:
    branches: ['claude/statics-try']
permissions: { contents: read }
concurrency: { group: xc-statics-try, cancel-in-progress: true }
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: bc, free: '1', tag: free }
          - { scenario: bc, free: '', tag: live }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (quiet)
        env: { T: '${{ secrets.PRIVATE_REPO_TOKEN }}', GIT_LFS_SKIP_SMUDGE: '1' }
        run: scripts/s5-setup.sh claude/pattern-families 1
      - name: Direct
        env:
          S5_DIRECT_FREE: '${{ matrix.free }}'
        run: |
          source scripts/xc/lib.sh
          # the functions bound on this ref but not on clean/integration (computed in the private checkout)
          export S5_CAPTURE_ONLY=$(git -C "$S5_REPO" diff --name-only --diff-filter=A origin/clean/integration HEAD -- crates/s5xcheck/src/functions/ \
            | sed -n 's/.*fn_\([0-9a-f]*\)\.rs$/\1/p' | tr a-f A-F | sed 's/^/FN_/' | paste -sd, -)
          echo "kinds: $(tr ',' '\n' <<< "$S5_CAPTURE_ONLY" | grep -c .)"
          scripts/xc/direct.sh ${{ matrix.scenario }}
      - name: Upload (private)
        if: always()
        env: { GH_TOKEN: '${{ secrets.PRIVATE_REPO_TOKEN }}' }
        run: |
          source scripts/xc/lib.sh
          s=${{ matrix.scenario }}-${{ matrix.tag }}; R=Kofi55533/siedler-data
          if [ ! -s "$XC/direct.json" ]; then
            ( cd "$S5_REPO" && cp recomp/Cargo.lock crates/s5xcheck/Cargo.lock && CARGO_TARGET_DIR=$S5_REPO/recomp/target \
              cargo test --release --no-run -j 3 --manifest-path crates/s5xcheck/Cargo.toml --test direct-functions \
              > /dev/null 2> /tmp/err.txt; rm -f crates/s5xcheck/Cargo.lock ) || true
            grep -E '^(error|warning: unused)' -A3 /tmp/err.txt | head -60 > builderr-$s.txt; echo "error lines: $(grep -c '^error' /tmp/err.txt)"
            gh release upload direct-check -R $R --clobber builderr-$s.txt > /dev/null && echo uploaded; exit 0
          fi
          gzip -c "$XC/direct.json" > statics-$s.json.gz
          gh release view direct-check -R $R > /dev/null 2>&1 || gh release create direct-check -R $R -t direct-check -n "direct-call check results" > /dev/null 2>&1 || true
          gh release upload direct-check -R $R --clobber statics-$s.json.gz > /dev/null && echo uploaded
