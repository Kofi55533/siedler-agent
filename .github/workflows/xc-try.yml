name: xc-try
# trial branch: one worker job with this branch's scripts on one kind
on:
  push:
    branches: ['claude/xc-bundle-trial']
permissions: { contents: read, issues: write }
jobs:
  trial:
    if: contains(github.event.head_commit.message, '[xc-try ')
    uses: ./.github/workflows/xc-worker.yml
    with: { n: '1', kinds: 'FN_5BD48A' }
    secrets: inherit
