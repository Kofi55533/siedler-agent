name: xc-try
# trial branch: worker jobs with this branch's scripts on the hand-written ports (claude/hand-<kind> in the project)
on:
  push:
    branches: ['claude/xc-hand-trial']
permissions: { contents: read, issues: write }
jobs:
  trial:
    if: contains(github.event.head_commit.message, '[xc-try ')
    uses: ./.github/workflows/xc-worker.yml
    with: { n: '1', kinds: 'FN_4AF630,FN_4A1357,FN_58E52F,FN_57C94A,TICK_BUILDING_PB_DarkTower3,TASK_SET_ANIM' }
    secrets: inherit
