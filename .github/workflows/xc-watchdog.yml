name: xc-watchdog
# Keeps the per-call differential loop running without any Claude or box session: census -> worker wave -> merges ->
# census. Every 20 min (schedules fire late on this repo; fleet-control's 5-min cycle dispatches this one
# too) it
#   - dispatches xc-census (main repo only) when none is queued or running and the last successful one is older than
#     6 h, or clean/integration moved since the work list was measured and no census started for 30 min (the
#     workers do not dispatch one per merge: merges in between share one census and its attribution);
#   - dispatches an xc-worker wave in this repo (main or a fork pool) when the work list has pickable kinds, no wave is
#     queued and fewer than XC_WORKERS kinds are claimed;
#   - opens one "[xc] pipeline stalled" issue in XC_AGENT when the last 3 census runs failed or no xc merge landed
#     in 24 h although kinds were pickable, and closes it once the loop moves again.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: xc-watchdog
  cancel-in-progress: true
env:
  XC_PROJECT: ${{ vars.XC_PROJECT || 'Kofi55533/siedler-sim-rs' }}
  XC_DATA: ${{ vars.XC_DATA || 'Kofi55533/siedler-data' }}
  XC_AGENT: ${{ vars.XC_AGENT || 'Kofi55533/siedler-agent' }}
jobs:
  watch:
    if: vars.XC_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the scripts of the main repository, as xc-worker does: a fork pool decides with the current picker without
      # being synced (only its workflow files come from the fork)
      - uses: actions/checkout@v4
        with: { repository: '${{ env.XC_AGENT }}', ref: main, sparse-checkout: scripts/xc, sparse-checkout-cone-mode: true }
      - name: Watch
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          DISPATCH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          XC_WORKERS: ${{ vars.XC_WORKERS || (github.repository == 'Kofi55533/siedler-agent' && '14' || '20') }}
        run: python3 scripts/xc/watchdog.py
